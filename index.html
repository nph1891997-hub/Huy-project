<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý vàng</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e2e5e9;--text:#1d2329;--muted:#6b7580;--accent:#a8760a;--green:#17803f;--red:#c0392b;--yellow:#a86b00;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1400px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;margin-right:10px;color:var(--accent)}
.spacer{flex:1}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit;color:var(--muted)}
nav button.on{background:#fbf3e0;color:var(--accent);font-weight:600}
#status{font-size:12px;color:var(--muted)}
#status.err{color:var(--red)}
main{max-width:1400px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:14px 0 6px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc}
td.n,th.n{text-align:right}
tr.total td{font-weight:600;background:#fafbfc}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted)}.small{font-size:12px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--text)}
button:hover{border-color:#b9c0c8}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--red)}
button.sm{padding:2px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;border:1px solid #cdd3da;border-radius:6px;padding:5px 8px;background:#fff;color:var(--text)}
input.money{text-align:right;width:150px}
input.w{width:56px;text-align:right}
input[type=number]{width:90px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:3px}
.field>span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;background:#eef1f4}
.grp-chot h2{color:var(--green)}.grp-sap h2{color:var(--yellow)}.grp-lo h2{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:14px}
.warn{background:#fff4e5;border:1px solid #f3d19c;border-radius:6px;padding:6px 10px;margin:8px 0}
.note{background:#eef4ff;border:1px solid #c9d8f5;border-radius:6px;padding:8px 10px;margin-bottom:12px}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;max-width:640px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(20,25,30,.35)}
dialog form{padding:16px}
dialog h2{margin:0 0 12px;font-size:17px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.preview{background:#fafbfc;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:8px}
.preview td{border:0;padding:2px 6px}
.old{color:var(--yellow)}
input.olddate{background:#fff4e5;border-color:#f3d19c}
.hidden{display:none!important}
summary{cursor:pointer;color:var(--muted)}
details[open] summary{margin-bottom:10px}
dialog details{margin:6px 0 4px}
.why{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.why h3{margin:4px 0 6px}
.why ul{margin:6px 0;padding-left:18px;white-space:normal}
.legend{font-size:12px;color:var(--muted);margin:4px 0}
.chart{width:100%;max-width:760px;height:auto;display:block;touch-action:pan-y}
.chart .axis{stroke:#cdd3da}
.chart .ax,.chart .lbl{font-size:11px;fill:var(--muted)}
.chart .l-br{fill:none;stroke:var(--accent);stroke-width:2}
.chart .l-mv{fill:none;stroke:#b9c0c8;stroke-width:1.2}
.chart .l-entry{stroke:var(--green);stroke-dasharray:6 4}
.chart .l-avg{stroke:var(--text);stroke-dasharray:2 3}
.chart .l-rebuy{stroke:var(--blue);stroke-dasharray:3 3}
.chart .m-buy{fill:var(--green)}.chart .m-sell{fill:var(--red)}
.chart .guide{stroke:var(--muted)}
body.view [data-act="lot-add"],body.view [data-act="lot-edit"],body.view [data-act="lot-del"],body.view [data-act="sell"],body.view [data-act="hold"],
body.view [data-act="sale-edit"],body.view [data-act="sale-del"],body.view [data-act="rebuy"],body.view [data-act="rebuy-clear"],body.view [data-act="price-del"],
body.view [data-act="type-del"],body.view [data-act="plan-confirm"],body.view [data-act="buy"],body.view [data-act="export-json"],body.view [data-act="import-json"],
body.view #btnUndo,body.view #typeForm{display:none!important}
/* Màn hình hẹp (điện thoại): tab Hôm nay không phải cuộn ngang */
@media (max-width:639px){
  main{padding:10px}
  .card{padding:10px}
  .bar{padding:6px 10px}
  #btnUndo{max-width:100%;white-space:normal;text-align:left}
  dialog td,.preview td{white-space:normal}
  /* Bảng giá: mỗi loại một khối */
  #priceForm .scroll{overflow:visible}
  #priceForm table,#priceForm tbody,table.lots,table.lots tbody,table.cards,table.cards tbody{display:block}
  #priceForm tr.hd,table.lots tr.hd,table.cards tr.hd{display:none}
  #priceForm tr.prow{display:grid;grid-template-columns:1fr auto;gap:6px 8px;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
  #priceForm tr.prow td{border:0;padding:0;white-space:normal}
  #priceForm .c-ten{font-weight:600}
  #priceForm .c-dv{text-align:right;color:var(--muted)}
  #priceForm .c-mv,#priceForm .c-br{grid-column:1/-1;display:flex;align-items:center;gap:8px}
  #priceForm .c-mv::before{content:"Tiệm mua vào";flex:1;font-size:12px;color:var(--muted)}
  #priceForm .c-br::before{content:"Tiệm bán ra";flex:1;font-size:12px;color:var(--muted)}
  #priceForm .c-mv input,#priceForm .c-br input{width:170px}
  #priceForm .c-buy{grid-column:1/-1}
  #priceForm .c-be{text-align:left;font-size:12px;color:var(--muted)}
  #priceForm .c-be::before{content:"Mua hôm nay cần tăng để hòa vốn "}
  #priceForm .c-note{grid-column:1/-1}
  #priceForm .c-kd{grid-column:1/-1}
  #priceForm .c-kd:empty{display:none}
  /* Nhóm lô: mỗi lô một thẻ */
  table.lots tr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border-bottom:1px solid var(--line);padding:8px 0}
  table.lots td{border:0;padding:0;white-space:normal}
  table.lots .c-con,table.lots .c-von,table.lots .c-kv,table.lots .c-nh{display:none}
  table.lots .c-lo{order:1}
  table.lots .c-pct{order:2;font-size:16px}
  table.lots .c-loi{order:3;text-align:left}
  table.lots .c-gt{order:4}
  table.lots .c-gt::before{content:"giá trị ";color:var(--muted);font-size:12px}
  table.lots .c-act{order:5;grid-column:1/-1}
  table.lots .c-act button{padding:5px 12px;font-size:14px;margin-top:2px}
  /* Bảng nhắc mua lại: thẻ có nhãn */
  table.cards tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
  table.cards td{display:flex;justify-content:space-between;gap:10px;border:0;padding:2px 0;white-space:normal}
  table.cards td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:12px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">🟡 Quản lý vàng</span>
    <nav id="tabs"></nav>
    <span class="spacer"></span>
    <button id="btnUndo" class="hidden" data-act="undo" title="Ctrl+Z"></button>
    <span id="status"></span>
    <input type="file" id="importFile" accept=".json,application/json" class="hidden">
  </div>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script>
'use strict';
// ===================== Hằng số & tiện ích =====================
const KEY = 'tai-san-v1';
const UNITS = [['luong', 10000, 'lượng'], ['chi', 1000, 'chỉ'], ['phan', 100, 'phân'], ['ly', 10, 'ly'], ['dem', 1, 'dem']];
const UNIT_DEM = { luong: 10000, chi: 1000, phan: 100, ly: 10, dem: 1 };
const UNIT_NAME = { luong: 'lượng', chi: 'chỉ', phan: 'phân', ly: 'ly', dem: 'dem' };
const unitOptions = sel => Object.keys(UNIT_NAME).map(u => `<option value="${u}" ${sel === u ? 'selected' : ''}>${UNIT_NAME[u]}</option>`).join('');
const TABS = [['homnay', 'Hôm nay'], ['lo', 'Lô vàng'], ['cantien', 'Cần tiền'], ['lichsu', 'Lịch sử'], ['thamso', 'Tham số']];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const addDays = (iso, n) => new Date(Date.parse(iso) + n * 864e5).toISOString().slice(0, 10);
const median = a => { const b = a.slice().sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const fmtD = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
// Định dạng số kiểu Việt Nam; tạo sẵn một lần (toLocaleString tạo bộ định dạng mới mỗi lần gọi, chậm khi vẽ hàng nghìn dòng)
const NF = new Intl.NumberFormat('vi-VN'), NF1 = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 1 }), NF2 = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 2 }),
  NFP = new Intl.NumberFormat('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const digits = x => (x == null || x === '' || isNaN(x)) ? '' : NF.format(Math.round(x));
// Nhập tiền: "118.500.000", "118500000", "118,5" hoặc "118.5" (số nhỏ hơn 1.000 hiểu là triệu),
// "148.500" hoặc "148500" (từ 1.000 đến dưới 1.000.000 hiểu là nghìn đồng, như bảng giá các tiệm), "118,5tr", "500k";
// ghi kèm "đ" thì đúng số đồng như gõ ("500.000đ")
function parseM(s) {
  let t = String(s ?? '').toLowerCase().replace(/\s/g, ''), mult = 1;
  const exact = t.endsWith('đ'); t = t.replace(/đ/g, '');
  if (t.endsWith('tr')) { mult = 1e6; t = t.slice(0, -2); } else if (t.endsWith('k')) { mult = 1e3; t = t.slice(0, -1); }
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');      // dấu phẩy là phần thập phân
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');  // 11.700.000 → dấu chấm ngăn nghìn
  const v = parseFloat(t.replace(/[^\d.]/g, ''));
  if (!isFinite(v) || v <= 0) return 0;
  if (mult === 1 && !exact) mult = v < 1000 ? 1e6 : v < 1e6 ? 1e3 : 1;
  return Math.round(v * mult);
}
// Số tiền viết vào ô nhập: dưới 1 triệu thì kèm "đ", để đọc lại (bấm Lưu) không bị hiểu thành nghìn đồng
const fmtIn = x => !x ? '' : x < 1e6 ? digits(x) + 'đ' : digits(x);
const parseN = s => { const v = Number(String(s ?? '').replace(',', '.')); return isNaN(v) ? 0 : v; };
const fmtM = x => (x == null || isNaN(x)) ? '—' : NF.format(Math.round(x)) + ' đ';
const fmtTr = x => x >= 1e6 ? (x >= 1e8 ? NF1 : NF2).format(x / 1e6) + 'tr' : digits(x) + 'đ';
const fmtMS = x => (x == null || isNaN(x)) ? '—' : (x > 0.5 ? '+' : '') + fmtM(x);
const fmtP = (x, sign = true) => (x == null || isNaN(x) || !isFinite(x)) ? '—' :
  (sign && x > 0 ? '+' : '') + NFP.format(x * 100) + '%';
const cls = x => x > 0.5 ? 'pos' : x < -0.5 ? 'neg' : '';
const clsP = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
function fmtW(dem) {
  if (!dem) return '0';
  const parts = []; let r = dem;
  for (const [, v, name] of UNITS) { const q = Math.floor(r / v); r -= q * v; if (q) parts.push(q + ' ' + name); }
  return parts.join(' ');
}
function splitW(dem) { const o = {}; let r = dem; for (const [k, v] of UNITS) { o[k] = Math.floor(r / v); r -= o[k] * v; } return o; }

// ===================== Dữ liệu =====================
function emptyData() {
  return {
    phien_ban: 1, cap_nhat: '',
    tham_so: { lai_suat_ngan_hang: 5.5, lam_phat: 3.5, vang_ky_vong_mac_dinh: 15, vang_sap_dat_mac_dinh: 2, vang_mua_giam_pct: 5, vang_han_muc_von: null },
    vang: { loai: [], gia: [], lo: [], ban: [], so_thu_tu: { lo: {}, ban: 0 } },
    tiet_kiem: [], cctg: [], dat: []
  };
}
function normalize(d) {
  const e = emptyData();
  d = d && typeof d === 'object' ? d : {};
  d.phien_ban = d.phien_ban || 1;
  d.tham_so = Object.assign(e.tham_so, d.tham_so || {});
  d.vang = Object.assign(e.vang, d.vang || {});
  d.vang.so_thu_tu = Object.assign({ lo: {}, ban: 0 }, d.vang.so_thu_tu || {});
  for (const k of ['tiet_kiem', 'cctg', 'dat']) if (!Array.isArray(d[k])) d[k] = [];
  return d;
}
const hasFSA = 'showOpenFilePicker' in window;
const JSON_TYPES = [{ description: 'Dữ liệu tài sản', accept: { 'application/json': ['.json'] } }];
// Trình duyệt không ghi thẳng vào file được (điện thoại, Safari, Firefox): chế độ xem, không lưu gì,
// để không sinh bộ dữ liệu thứ hai lệch với file trên máy tính
const VIEW = !hasFSA;
const oldLocal = VIEW ? (() => { try { return localStorage.getItem(KEY); } catch { return null; } })() : null;
let D = VIEW ? emptyData() : (() => { try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch { return emptyData(); } })();

// ----- Lưu: trình duyệt + file -----
let fileHandle = null, pendingHandle = null, saveChain = Promise.resolve(), saveErrShown = false, localErrShown = false;
let booting = hasFSA;   // đang kiểm tra file đã nhớ: chưa hiện gì để không lộ số liệu cũ trong trình duyệt
function setStatus(msg, err) { const s = $('#status'); s.textContent = msg; s.className = err ? 'err' : ''; }
// Mốc đồng bộ: cap_nhat của lần cuối đọc hoặc ghi file thành công (lưu trong trình duyệt, không nằm trong file)
const SYNC_KEY = 'tai-san-dong-bo', CAP_KEY = KEY + '-cap';
const getMark = () => { try { return localStorage.getItem(SYNC_KEY) || ''; } catch { return ''; } };
const setMark = v => { try { localStorage.setItem(SYNC_KEY, v); } catch { } };
// Dấu lần đọc/ghi cuối của riêng tab này (không dùng chung giữa các tab như mốc đồng bộ):
// thời điểm sửa file và cap_nhat. Dùng để biết nơi lưu có bị tab/máy khác sửa không.
let seen = { mod: null, cap: (() => { try { return localStorage.getItem(CAP_KEY) ?? ''; } catch { return ''; } })() };
let gen = 0;   // tăng mỗi khi nạp dữ liệu từ nơi khác: các lần lưu xếp hàng từ trước đó bỏ đi
const stamp = () => { const n = new Date(); return `${today()}-${String(n.getHours()).padStart(2, '0')}h${String(n.getMinutes()).padStart(2, '0')}`; };
const backupName = () => `ban-trinh-duyet-${stamp()}.json`;
// Nơi lưu (file, hoặc bản trong trình duyệt khi chưa kết nối file) có bị sửa ở nơi khác kể từ lần tab này đọc/ghi cuối không.
// Xem thời điểm sửa của file trước, khác mới đọc file để so cap_nhat (OneDrive chỉ chạm vào file thì không tính).
async function storeChanged() {
  try {
    if (fileHandle) {
      const fi = await fileHandle.getFile();
      if (seen.mod != null && fi.lastModified === seen.mod) return null;
      const text = await fi.text(); if (!text.trim()) return null;
      const raw = JSON.parse(text); if (!raw || typeof raw.vang !== 'object') return null;
      if ((raw.cap_nhat || '') === seen.cap) { seen.mod = fi.lastModified; return null; }
      return { F: normalize(raw), mod: fi.lastModified };
    }
    if (VIEW) return null;
    const c = localStorage.getItem(CAP_KEY);
    if (c == null || c === seen.cap) return null;
    return { F: normalize(JSON.parse(localStorage.getItem(KEY))), mod: null };
  } catch { return null; }
}
// Nạp dữ liệu đã bị sửa ở nơi khác: bỏ hoàn tác và các lần lưu đang xếp hàng, đóng hộp thoại đang mở (nó giữ dữ liệu cũ)
function adopt(F, mod) {
  gen++; D = F; _cache = null; undoStack.length = 0; ui.plans = null;
  lastJSON = JSON.stringify(D);
  try { localStorage.setItem(KEY, lastJSON); localStorage.setItem(CAP_KEY, D.cap_nhat || ''); } catch { }
  seen = { mod, cap: D.cap_nhat || '' };
  if (fileHandle) setMark(D.cap_nhat || '');
  const hadDlg = dlg.open; if (hadDlg) dlg.close();
  return hadDlg;
}
function persist() {
  D.cap_nhat = new Date().toISOString();
  const compact = lastJSON = JSON.stringify(D), text = fileHandle ? JSON.stringify(D, null, 2) : '', ts = D.cap_nhat, h = fileHandle, myGen = gen;
  saveChain = saveChain.then(async () => {
    if (myGen !== gen) return;                     // dữ liệu đã được nạp lại từ nơi khác sau lần thay đổi này
    const ext = await storeChanged();              // trước mỗi lần lưu: nơi lưu bị sửa ở nơi khác thì không ghi đè
    if (ext) {
      const name = backupName(); download(name, h ? text : compact, 'application/json');
      const hadDlg = adopt(ext.F, ext.mod);
      ui.notice = `Thay đổi vừa rồi chưa được lưu vì dữ liệu đã được sửa ở nơi khác (tab hoặc máy khác). App đã nạp dữ liệu mới, hãy làm lại thao tác.${hadDlg ? ' Hộp thoại đang mở đã đóng lại.' : ''} Bản trình duyệt có thay đổi vừa rồi đã tải về thành <b>${name}</b>.`;
      return render();
    }
    let localOK = true;
    try { localStorage.setItem(KEY, compact); localStorage.setItem(CAP_KEY, ts); } catch (e) { localOK = false; }
    if (!h) {
      // Lần ghi lỗi không tính là đã lưu: lần lưu sau so với lần ghi thành công cuối, không báo nhầm "sửa ở nơi khác"
      if (localOK) { seen = { mod: null, cap: ts }; return persistStatus(); }
      setStatus('Chưa lưu được: bộ nhớ trình duyệt đầy', true);
      if (!localErrShown) { localErrShown = true; alert('Không lưu được vào bộ nhớ trình duyệt (có thể đã đầy). Hãy lưu vào file để không mất dữ liệu: Tham số → Dữ liệu → Tạo file mới….'); }
      return;
    }
    try {
      const w = await h.createWritable(); await w.write(text); await w.close();
      seen = { mod: (await h.getFile()).lastModified, cap: ts };
      if (localOK) setMark(ts);
      else {   // bản trong trình duyệt đã cũ: xóa mốc để lần mở sau dùng dữ liệu trong file
        try { localStorage.removeItem(SYNC_KEY); } catch { }
        if (!localErrShown) { localErrShown = true; alert('Bộ nhớ trình duyệt đầy; dữ liệu vẫn được lưu vào file ' + h.name + '.'); }
      }

function cashPlans(X) {
  const sts = openLots().map(l => lotState(l)).filter(s => s.hasPrice && s.n > 0 && s.valMon > 0);
  const prof = sts.filter(s => s.g >= 0), loss = sts.filter(s => s.g < 0).sort((a, b) => b.g - a.g);
  const got = rows => rows.reduce((a, x) => a + x.k * x.s.valMon, 0);
  const fill = (order, rows = []) => {
    rows = rows.slice(); let have = got(rows);
    for (const s of order) {
      if (have >= X) break;
      const k = Math.min(s.n, Math.ceil((X - have) / s.valMon));
      rows.push({ s, k }); have += k * s.valMon;
    }
    return rows;
  };
  // Bỏ bớt món thừa: nếu bỏ một món mà vẫn đủ tiền thì không bán món đó (xét từ lô ít ưu tiên nhất)
  const prune = rows => {
    rows = rows.map(x => ({ ...x })); let have = got(rows);
    for (let i = rows.length - 1; i >= 0; i--) while (rows[i].k > 0 && have - rows[i].s.valMon >= X) { rows[i].k--; have -= rows[i].s.valMon; }
    return rows.filter(x => x.k > 0);
  };
  const A = prune(fill(loss, fill(prof.slice().sort((a, b) => b.reached - a.reached || b.g - a.g))));
  const single = prof.filter(s => s.n * s.valMon >= X).map(s => ({ s, k: Math.ceil(X / s.valMon) }))
    .sort((a, b) => (a.k * a.s.valMon - X) - (b.k * b.s.valMon - X));
  const B = single.length ? [single[0]] : prune(fill(loss, fill(prof.slice().sort((a, b) => b.n * b.valMon - a.n * a.valMon))));
  const C = prune(fill(loss, fill(prof.slice().sort((a, b) => a.g - b.g))));
  const toPlan = (name, desc, rows) => ({ name, desc, rows: rows.map(x => ({ id: x.s.lot.id, k: x.k })) });
  const plans = [
    toPlan('A. Chốt lời tốt nhất', 'Lô đạt mục tiêu trước, rồi lô lời % cao nhất', A),
    toPlan('B. Ít lô nhất', 'Ưu tiên một lô bán vừa đủ, hạn chế cắt lẻ nhiều lô', B),
    toPlan('C. Giữ lô tốt', 'Bán lô lời ít trước, giữ lô lời nhiều cho chạy tiếp', C)
  ];
  const key = p => JSON.stringify(p.rows);
  plans.forEach((p, i) => { const j = plans.findIndex(q => key(q) === key(p)); if (j < i) p.same = plans[j].name.slice(0, 1); });
  return plans;
}
function planSummary(plan, X) {
  let thu = 0, von = 0, lossLoi = 0, lossVsBank = 0, cutLoss = 0, valid = true;
  const rows = plan.rows.map(r => {
    const lot = lotById(r.id); const s = lotState(lot);
    if (r.k > s.n || r.k < 0) valid = false;
    const t = r.k * s.valMon, v = r.k * s.costMon, bank = v * (1 + r_() * s.d / 365);
    thu += t; von += v; if (s.cut) cutLoss += r.k * s.cut.unitLoss;
    if (t - v < 0) { lossLoi += t - v; lossVsBank += t - bank; }
    return { r, s, t, v, loi: t - v };
  });
  const totalDem = openLots().reduce((a, l) => a + (l.so_mon - soldMon(l.id)) * l.trong_luong_mon_dem, 0) -
    rows.reduce((a, x) => a + x.r.k * x.s.lot.trong_luong_mon_dem, 0);
  const totalV = openLots().reduce((a, l) => a + lotState(l).V, 0) - von;
  return { rows, thu, von, loi: thu - von, du: thu - X, lossLoi, lossVsBank, cutLoss, totalDem, totalV, valid };
}

  // Lô mới: mặc định loại của lô nhập gần nhất, trọng lượng mỗi món của lô gần nhất cùng loại;
  // loại chưa có lô nào (kể cả loại mới tạo trong form) thì 1 đơn vị niêm yết của loại
  const lastW = (typeId, newUnit = 'luong') => [...D.vang.lo].reverse().find(l => l.loai_id === typeId)?.trong_luong_mon_dem ||
    UNIT_DEM[typeId === '__new' ? newUnit : typeById(typeId)?.don_vi_niem_yet || 'chi'];
  const defType = prefill?.loai_id || D.vang.lo.at(-1)?.loai_id || D.vang.loai[0]?.id || '__new';
  lot = lot || Object.assign({ ngay_mua: today(), loai_id: defType, so_mon: 1, trong_luong_mon_dem: lastW(defType), tong_tien_mua: 0, ky_vong_pct: T.vang_ky_vong_mac_dinh, sap_dat_pct: T.vang_sap_dat_mac_dinh, ghi_chu: '' }, prefill || {});
  // wTouched: đã gõ trọng lượng, không tự đổi theo loại nữa. wPrefill: trọng lượng đang là số điền sẵn,
  // lần đầu gõ vào một ô thì xóa các ô còn lại (tránh 1 chỉ điền sẵn + gõ 1 lượng = 1 lượng 1 chỉ)
  let last = prefill?.don_gia ? 'dg' : 'tong', autoPrice = !isEdit && !prefill?.don_gia, wTouched = isEdit || !!(prefill && prefill.trong_luong_mon_dem), wPrefill = !isEdit;
  openDlg(`<h2>${isEdit ? 'Sửa lô ' + esc(lot.id) : fromSale ? 'Mua lại (từ lần bán ' + esc(fromSale) + ')' : 'Thêm lô vàng'}</h2>
    <div class="row"><label class="field"><span>Ngày mua</span><input type="date" name="ngay" value="${lot.ngay_mua}" max="${today()}" required></label>
      <label class="field"><span>Loại vàng</span><select name="loai">${typeOptions(lot.loai_id)}<option value="__new" ${lot.loai_id === '__new' ? 'selected' : ''}>➕ Loại mới…</option></select></label></div>
    <div class="row" id="newType"><label class="field"><span>Tên loại mới</span><input name="ten_moi" placeholder="VD: SJC miếng"></label>
      <label class="field"><span>Đơn vị niêm yết giá</span><select name="dv_moi">${unitOptions('luong')}</select></label></div>
    <div class="row"><label class="field"><span>Số món</span><input type="number" min="1" name="so_mon" value="${lot.so_mon}" style="width:70px"></label>
      <span style="padding-bottom:6px">×</span> ${wInputs('w', lot.trong_luong_mon_dem)}</div>
    <p id="wInfo"></p>
    <div class="row"><label class="field"><span id="dgLabel">Đơn giá</span><input class="money" name="don_gia" value="${fmtIn(prefill?.don_gia)}"></label>
      <label class="field"><span>Tổng tiền mua</span><input class="money" name="tong" value="${fmtIn(lot.tong_tien_mua)}"></label></div>
    <div class="row"><label class="field"><span>% kỳ vọng</span><input type="number" step="0.1" name="kv" value="${lot.ky_vong_pct}"></label></div>
    <details${lot.ghi_chu || lot.sap_dat_pct !== T.vang_sap_dat_mac_dinh || typeof lot.nhac_tut_pct === 'number' ? ' open' : ''}><summary>Tùy chọn khác: mức báo sắp đạt, nhắc khi lời tụt, ghi chú</summary>
      <div class="row"><label class="field"><span>Báo "sắp đạt" khi giá còn cần tăng ≤ (%)</span><input type="number" step="0.1" name="sd" value="${lot.sap_dat_pct}"></label>
      <label class="field"><span>Nhắc chốt nếu lời tụt về (%)</span><input type="number" step="0.1" name="nt" value="${lot.nhac_tut_pct ?? ''}" placeholder="trống = không nhắc"${latestPrice(lot.loai_id) ? '' : ' disabled title="Loại này chưa có giá, chưa đặt được mức nhắc"'}></label>
      <label class="field" style="flex:1"><span>Ghi chú</span><input name="ghi_chu" value="${esc(lot.ghi_chu)}" placeholder="Nơi mua, số seri…"></label></div></details>
    <div class="dlg-actions"><button value="cancel" type="submit" formnovalidate>Hủy</button><button class="primary" type="submit">Lưu</button></div>`,
    f => {
      const n = Math.floor(parseN(f.so_mon.value)), wd = readW(f, 'w'), tong = parseM(f.tong.value);
      let loai = f.loai.value;
      if (!f.ngay.value) return alert('Chưa nhập ngày mua.'), false;
      if (n < 1) return alert('Số món phải từ 1 trở lên.'), false;
      if (wd < 1) return alert('Chưa nhập trọng lượng mỗi món.'), false;
      if (tong <= 0) return alert('Chưa nhập giá mua.'), false;
      if (loai === '__new' && !f.ten_moi.value.trim()) return alert('Chưa nhập tên loại vàng mới.'), false;
      if (isEdit && n < soldMon(lot.id)) return alert('Lô đã bán ' + soldMon(lot.id) + ' món, số món không được nhỏ hơn.'), false;
      if (isEdit && D.vang.ban.some(b => b.lo_id === lot.id && b.ngay < f.ngay.value)) return alert('Ngày mua không được sau ngày của các lần bán.'), false;
      if (f.ngay.value > today()) return alert('Ngày mua không được sau hôm nay.'), false;
      if (!(parseN(f.kv.value) > 0)) return alert('% kỳ vọng phải lớn hơn 0.'), false;
      if (parseN(f.sd.value) < 0) return alert('Mức báo sắp đạt không được âm.'), false;
      const unitSel = loai === '__new' ? f.dv_moi.value : typeById(loai)?.don_vi_niem_yet;
      const ntRaw = f.nt.disabled ? String(lot.nhac_tut_pct ?? '') : f.nt.value.trim();
      if (ntRaw !== '' && (!isEdit || parseN(ntRaw) !== lot.nhac_tut_pct)) {   // chỉ xét khi đặt mức mới
        const nt = parseN(ntRaw), p = loai === '__new' ? null : latestPrice(loai);
        if (!(nt > 0)) return alert('Mức nhắc khi lời tụt phải lớn hơn 0, hoặc để trống.'), false;
        if (!p) return alert('Loại vàng này chưa có giá, chưa đặt được mức nhắc.'), false;
        const g = p.mua_vao / (tong / (n * wd / UNIT_DEM[unitSel])) - 1;
        if (nt >= g * 100) return alert(`Mức nhắc phải thấp hơn lời hiện tại (${fmtP(g)}), hoặc để trống.`), false;
      }
      if (isEdit && soldMon(lot.id) > 0 && loai !== '__new' && typeById(loai)?.don_vi_niem_yet !== typeById(lot.loai_id)?.don_vi_niem_yet)
        return alert('Lô đã có lần bán tính giá theo ' + UNIT_NAME[typeById(lot.loai_id)?.don_vi_niem_yet] + ', không đổi sang loại vàng có đơn vị niêm yết khác được.'), false;
      if (isEdit && soldMon(lot.id) > 0 && loai === '__new' && f.dv_moi.value !== typeById(lot.loai_id)?.don_vi_niem_yet)
        return alert('Lô đã có lần bán, loại mới phải cùng đơn vị niêm yết với loại cũ.'), false;
      { // chống gõ nhầm đơn giá (nhầm giá lượng/chỉ, thừa/thiếu số 0) với lô mua gần đây
        const unit = loai === '__new' ? f.dv_moi.value : typeById(loai)?.don_vi_niem_yet, p = loai === '__new' ? null : latestPrice(loai);
        const dg = tong / (n * wd / UNIT_DEM[unit]);
        if (p && p.ban_ra && f.ngay.value >= p.ngay && Math.abs(dg / p.ban_ra - 1) > 0.15 &&
          !confirm(`Đơn giá ${fmtM(dg)}/${UNIT_NAME[unit]} lệch ${fmtP(dg / p.ban_ra - 1)} so với giá tiệm bán ra ngày ${fmtD(p.ngay)} (${fmtM(p.ban_ra)}). Giá này có đúng không?`)) return false;
      }
      const lim = D.tham_so.vang_han_muc_von;
      if (!isEdit && lim) {
        const after = openLots().reduce((a, l) => a + lotState(l).V, 0) + tong;
        if (after > lim && !confirm(`Vốn đang giữ sẽ lên ${fmtTr(after)}, vượt hạn mức ${fmtTr(lim)}. Vẫn lưu?`)) return false;
      }
      if (loai === '__new') {
        loai = 't' + Date.now().toString(36);
        D.vang.loai.push({ id: loai, ten: f.ten_moi.value.trim(), don_vi_niem_yet: f.dv_moi.value });
      }
      const data = { loai_id: loai, ngay_mua: f.ngay.value, so_mon: n, trong_luong_mon_dem: wd, tong_tien_mua: tong, ky_vong_pct: parseN(f.kv.value), sap_dat_pct: parseN(f.sd.value), nhac_tut_pct: ntRaw === '' ? null : parseN(ntRaw), ghi_chu: f.ghi_chu.value.trim() };
      if (isEdit) Object.assign(lotById(lot.id), data);
      else {
        D.vang.lo.push(Object.assign({ id: nextLotId(data.ngay_mua.slice(0, 4)) }, data));
      }
      if (fromSale) { const b = D.vang.ban.find(x => x.id === fromSale); if (b) b.gia_mua_lai = null; }
      commit(isEdit ? 'sửa lô ' + lot.id : 'thêm lô ' + D.vang.lo.at(-1).id);
    },
    (f, e) => {
      const isNew = f.loai.value === '__new';
      $('#newType').classList.toggle('hidden', !isNew);
      f.nt.disabled = isNew || !latestPrice(f.loai.value);
      if (e.target && /^w_/.test(e.target.name)) {
        if (wPrefill) for (const [k] of UNITS) if ('w_' + k !== e.target.name) f['w_' + k].value = '';
        wTouched = true; wPrefill = false;
      }
      if (e.target && (e.target.name === 'loai' || e.target.name === 'dv_moi') && !wTouched) {
        const o = splitW(lastW(f.loai.value, f.dv_moi.value)); for (const [k] of UNITS) f['w_' + k].value = o[k] || '';
      }
      const unit = isNew ? f.dv_moi.value : typeById(f.loai.value)?.don_vi_niem_yet || 'chi';
      const n = Math.floor(parseN(f.so_mon.value)), wd = readW(f, 'w'), qty = n * wd / UNIT_DEM[unit];
      $('#dgLabel').textContent = 'Đơn giá (mỗi ' + UNIT_NAME[unit] + ')';
      const qtyStr = qty.toLocaleString('vi-VN', { maximumFractionDigits: 4 }) + ' ' + UNIT_NAME[unit];
      $('#wInfo').innerHTML = n > 0 && wd > 0 ? `Mỗi món <b>${fmtW(wd)}</b> · cả lô <b>${fmtW(n * wd)}</b>${fmtW(n * wd) !== qtyStr ? ' = ' + qtyStr : ''}` : '';
      const tgt = e.target && e.target.name;
      if (tgt === 'don_gia') last = 'dg'; else if (tgt === 'tong') last = 'tong';
      // Lô mới: tự điền đơn giá = giá tiệm bán ra mới nhất của loại, cho tới khi bạn tự gõ giá
      if (tgt === 'don_gia' || tgt === 'tong') autoPrice = false;
      if (autoPrice && !isNew) { const p = latestPrice(f.loai.value); f.don_gia.value = p && p.ban_ra && f.ngay.value >= p.ngay ? fmtIn(p.ban_ra) : ''; last = 'dg'; }
      if (!qty) return;
      if (last === 'dg') f.tong.value = fmtIn(parseM(f.don_gia.value) * qty);
      else if (tgt !== 'don_gia') f.don_gia.value = fmtIn(parseM(f.tong.value) / qty);
    });
}

function dlgSale(lotId, sale) {
  const lot = lotById(lotId), s = lotState(lot), t = s.t;
  const maxN = s.n + (sale ? sale.so_mon : 0);   // khi sửa: số món của chính lần bán này được tính lại vào
  if (maxN <= 0) return;
  const unit = UNIT_NAME[t.don_vi_niem_yet];
  const priceNote = !sale && s.p ? `<span class="small ${s.p.ngay < today() ? 'old' : 'muted'}">Giá tiệm mua vào ngày ${fmtD(s.p.ngay)}${s.p.ngay < today() ? ', nên kiểm tra giá thực tế' : ''}</span>` : '';
  openDlg(`<h2>${sale ? 'Sửa lần bán ' + esc(sale.id) : 'Bán lô ' + esc(lot.id)} · ${esc(t.ten)}</h2>
    <p class="muted">${sale ? 'Lô ' + esc(lot.id) + ' · ' : ''}Có thể bán ${maxN} món × ${fmtW(lot.trong_luong_mon_dem)} · mua ngày ${fmtD(lot.ngay_mua)}</p>
    <div class="row"><label class="field"><span>Số món bán (tối đa ${maxN})</span><input type="number" min="1" max="${maxN}" name="k" value="${sale ? sale.so_mon : 1}" style="width:80px"></label>
      <label class="field"><span>Giá bán (mỗi ${unit})</span><input class="money" name="gia" value="${sale ? fmtIn(sale.gia_ban) : s.hasPrice ? fmtIn(s.P) : ''}"></label></div>
    ${priceNote ? `<div class="row">${priceNote}</div>` : ''}
    ${!sale && s.cut ? '<div class="row"><span class="small old" id="cutNote"></span></div>' : ''}
    <div class="row"><button type="button" class="sm" data-fill="het">Bán hết</button><button type="button" class="sm" data-fill="von">Bán lấy lại vốn</button><button type="button" class="sm" data-fill="nua">Bán một nửa</button></div>
    <details${sale ? ' open' : ''}><summary>Tùy chọn khác: ngày bán khác hôm nay, giá muốn mua lại, ghi chú</summary>
      <div class="row"><label class="field"><span>Ngày bán</span><input type="date" name="ngay" value="${sale ? sale.ngay : today()}" min="${lot.ngay_mua}" max="${today()}" required></label>
      <label class="field"><span>Giá muốn mua lại (mỗi ${unit})</span><input class="money" name="mua_lai" value="${sale && sale.gia_mua_lai ? fmtIn(sale.gia_mua_lai) : ''}"></label>
      <label class="field" style="flex:1"><span>Ghi chú</span><input name="ghi_chu" value="${sale ? esc(sale.ghi_chu) : ''}"></label></div></details>
    <div class="preview" id="salePreview"></div>
    <div class="dlg-actions"><button value="cancel" type="submit">Hủy</button><button class="primary" type="submit">${sale ? 'Lưu' : 'Xác nhận bán'}</button></div>`,
    f => {
      const k = Math.floor(parseN(f.k.value)), gia = parseM(f.gia.value);
      if (!f.ngay.value) return alert('Chưa nhập ngày bán.'), false;
      if (f.ngay.value < lot.ngay_mua) return alert('Ngày bán không được trước ngày mua.'), false;
      if (f.ngay.value > today()) return alert('Ngày bán không được sau hôm nay.'), false;
      if (k < 1 || k > maxN) return alert('Số món bán phải từ 1 đến ' + maxN + '.'), false;
      if (gia <= 0) return alert('Chưa nhập giá bán.'), false;
      if (!sale && s.P && Math.abs(gia / s.P - 1) > 0.15 &&
        !confirm(`Giá bán ${fmtM(gia)}/${unit} lệch ${fmtP(gia / s.P - 1)} so với giá tiệm mua vào gần nhất (${fmtM(s.P)}). Giá này có đúng không?`)) return false;
      const data = { ngay: f.ngay.value, so_mon: k, gia_ban: gia, gia_mua_lai: parseM(f.mua_lai.value) || null, ghi_chu: f.ghi_chu.value.trim() };
      if (sale) Object.assign(sale, data);
      else {
        D.vang.ban.push(Object.assign({ id: nextSaleId(), lo_id: lot.id }, data));
      }
      commit(sale ? 'sửa lần bán ' + sale.id : `bán ${k} món lô ${lot.id}`);
    },
    f => {
      const k = Math.floor(parseN(f.k.value)), gia = parseM(f.gia.value);
      const c = saleCalc({ lo_id: lot.id, ngay: f.ngay.value || today(), so_mon: k, gia_ban: gia });
      const left = maxN - k;
      if (!sale && s.cut) $('#cutNote').textContent = k >= 1 && k <= maxN ? 'T' + cutText(s, k, 'số món này').slice(1) : '';
      $('#salePreview').innerHTML = k >= 1 && k <= maxN && gia > 0 ? `<table>
        <tr><td>Tiền thu về</td><td class="n"><b>${fmtM(c.thu)}</b></td></tr>
        <tr><td>Vốn của phần bán</td><td class="n">${fmtM(c.von)}</td></tr>
        <tr><td>Lời/lỗ chốt</td><td class="n ${cls(c.loi)}"><b>${fmtMS(c.loi)} (${fmtP(c.g)})</b></td></tr>
        <tr><td>Nếu số vốn này gửi ngân hàng (${c.d} ngày)</td><td class="n">${fmtM(c.bank)} → <span class="${cls(c.vsBank)}">${c.vsBank >= 0 ? 'vàng hơn' : 'vàng thua'} ${fmtM(Math.abs(c.vsBank))}</span></td></tr>
        <tr><td>Lô còn lại sau khi bán</td><td class="n">${left} món${left > 0 ? ' · ' + fmtW(left * lot.trong_luong_mon_dem) + ' · vốn ' + fmtM(left * s.costMon) : ' · lô sẽ đóng'}</td></tr></table>`
        : '<span class="muted">Nhập số món và giá bán để xem trước.</span>';
    });
  $('#dlgForm').addEventListener('click', e => {
    const b = e.target.closest('[data-fill]'); if (!b) return;
    const f = $('#dlgForm'), gia = parseM(f.gia.value);
    const st = { n: maxN, V: maxN * s.costMon, valMon: s.w * (gia || s.P || 0) };
    if (b.dataset.fill === 'von' && !st.valMon) return alert('Nhập giá bán trước.');
    f.k.value = sellK[b.dataset.fill](st);
    f.dispatchEvent(new Event('input'));
  });
}

// Giữ, nâng mục tiêu (lô đã đạt mục tiêu) hoặc Giữ tiếp (lô đang tụt dưới mức nhắc)
function dlgHold(lotId) {
  const lot = lotById(lotId), s = lotState(lot), unit = UNIT_NAME[s.t.don_vi_niem_yet], gp = s.g * 100, tiep = s.tut;
  const defKv = tiep ? lot.ky_vong_pct : Math.ceil((gp + 1) / 5) * 5;
  let defNt = Math.floor((gp - 1) / 5) * 5;                 // làm tròn xuống bội số 5%, thấp hơn lời hiện tại ít nhất 1 điểm
  if (!tiep) defNt = Math.max(lot.ky_vong_pct, defNt);      // lần đầu giữ: không thấp hơn mục tiêu cũ
  if (defNt <= 0 || defNt >= gp) defNt = '';
  const price = pct => fmtM(s.V * (1 + pct / 100) / (s.n * s.w)) + '/' + unit;
  openDlg(`<h2>${tiep ? 'Giữ tiếp' : 'Giữ'} lô ${esc(lot.id)} · ${esc(s.t.ten)}</h2>
    <p>${tiep ? `Lời đã tụt về <b>${fmtP(s.g)}</b>, dưới mức nhắc ${fmtP(s.nt, false)}. Giữ tiếp thì đặt mức nhắc mới, để trống nếu không muốn nhắc nữa.`
      : `Lô đang lời <b class="pos">${fmtP(s.g)}</b>, đã vượt mục tiêu ${fmtP(s.kv, false)}. Lô chuyển sang nhóm Giữ; app nhắc lại khi lời đạt mục tiêu mới, hoặc khi lời tụt về dưới mức nhắc.`}</p>
    <div class="row"><label class="field"><span>Mục tiêu mới (%)</span><input type="number" step="0.1" name="kv" value="${defKv}"><span id="kvInfo"></span></label>
      <label class="field"><span>Nhắc chốt nếu lời tụt về (%)</span><input type="number" step="0.1" name="nt" value="${defNt}" placeholder="trống = không nhắc"><span id="ntInfo"></span></label></div>
    <p class="small muted">Giá tiệm mua vào hiện tại: ${fmtM(s.P)}/${unit}.</p>
    <div class="dlg-actions"><button value="cancel" type="submit">Hủy</button><button class="primary" type="submit">${tiep ? 'Giữ tiếp' : 'Lưu mục tiêu mới'}</button></div>`,
    f => {
      const kv = parseN(f.kv.value), ntRaw = f.nt.value.trim(), nt = ntRaw === '' ? null : parseN(ntRaw);
      if (!(kv > gp)) return alert('Mục tiêu mới phải cao hơn mức lời hiện tại (' + fmtP(s.g) + ').'), false;
      if (nt != null && (!(nt > 0) || nt >= gp)) return alert('Mức nhắc phải lớn hơn 0 và thấp hơn mức lời hiện tại (' + fmtP(s.g) + '), hoặc để trống.'), false;
      lot.ky_vong_pct = kv; lot.nhac_tut_pct = nt;
      commit((tiep ? 'giữ tiếp lô ' : 'nâng mục tiêu lô ') + lot.id);
    },
    f => {
      $('#kvInfo').textContent = parseN(f.kv.value) > 0 ? 'giá tiệm mua vào ' + price(parseN(f.kv.value)) : '';
      $('#ntInfo').textContent = f.nt.value.trim() === '' ? 'không nhắc' : 'giá tiệm mua vào ' + price(parseN(f.nt.value));
    });
}

// ===================== Sự kiện =====================
const act = {
  tab: d => { tab = d.k; render(); window.scrollTo(0, 0); },
  'lot-add': () => dlgLot(null),
  'lot-edit': d => dlgLot(lotById(d.id)),
  'lot-del': d => {
    const nb = D.vang.ban.filter(b => b.lo_id === d.id).length;
    if (!confirm(`Xóa lô ${d.id}${nb ? ` cùng ${nb} lần bán của nó (lời đã chốt của các lần bán này cũng mất)` : ''}?`)) return;
    D.vang.lo = D.vang.lo.filter(l => l.id !== d.id); D.vang.ban = D.vang.ban.filter(b => b.lo_id !== d.id);
    if (ui.loOpen === d.id) ui.loOpen = null;
    commit('xóa lô ' + d.id);
  },
  'lot-detail': d => { ui.loOpen = ui.loOpen === d.id ? null : d.id; render(); },
  sell: d => dlgSale(d.id),
  hold: d => dlgHold(d.id),
  'sale-edit': d => { const b = D.vang.ban.find(x => x.id === d.id); if (b) dlgSale(b.lo_id, b); },
  rebuy: d => {
    const b = D.vang.ban.find(x => x.id === d.id), lot = b && lotById(b.lo_id); if (!lot) return;
    dlgLot(null, { loai_id: lot.loai_id, trong_luong_mon_dem: lot.trong_luong_mon_dem, so_mon: b.so_mon, fromSale: b.id });
  },
  buy: d => { const f = $('#priceForm'); dlgLot(null, { loai_id: d.id, don_gia: (f && parseM(f['br_' + d.id].value)) || latestPrice(d.id)?.ban_ra }); },
  'prices-all': () => { ui.lsAllPrices = true; render(); },
  'sale-del': d => { if (confirm('Xóa lần bán ' + d.id + '? Số món sẽ được trả lại cho lô.')) { D.vang.ban = D.vang.ban.filter(b => b.id !== d.id); commit('xóa lần bán ' + d.id); } },
  'rebuy-clear': d => { const b = D.vang.ban.find(x => x.id === d.id); if (b) { b.gia_mua_lai = null; commit('bỏ nhắc mua lại ' + b.id); } },
  'price-del': d => { const p = D.vang.gia[+d.i]; if (p && confirm('Xóa dòng giá ngày ' + fmtD(p.ngay) + '?')) { D.vang.gia.splice(+d.i, 1); commit('xóa giá ngày ' + fmtD(p.ngay)); } },
  'type-del': d => { if (confirm('Xóa loại vàng này cùng lịch sử giá của nó?')) { D.vang.loai = D.vang.loai.filter(t => t.id !== d.id); D.vang.gia = D.vang.gia.filter(p => p.loai_id !== d.id); commit('xóa loại vàng'); } },
  'plan-confirm': d => {
    const p = ui.plans[+d.plan], rows = p.rows.filter(x => x.k > 0);
    const S = planSummary({ rows }, ui.cash);
    if (!confirm(`Xác nhận bán theo ${p.name}?\n\n` + S.rows.map(x => `${x.s.lot.id}: ${x.r.k} món → ${fmtM(x.t)}`).join('\n') + `\n\nTổng thu: ${fmtM(S.thu)} · Lời/lỗ: ${fmtMS(S.loi)}`)) return;
    for (const x of S.rows) {
      D.vang.ban.push({ id: nextSaleId(), lo_id: x.s.lot.id, ngay: today(), so_mon: x.r.k, gia_ban: x.s.P, gia_mua_lai: null, ghi_chu: 'Cần tiền ' + fmtM(ui.cash) });
    }
    ui.plans = null; ui.cash = 0; tab = 'lichsu'; commit(`bán theo phương án ${p.name.slice(0, 1)} (${S.rows.length} lô)`);
  },
  undo: () => undo(),
  'all-same': () => markSame(),
  'price-today': () => { ui.priceDate = today(); const f = $('#priceForm'); f.ngay.value = ui.priceDate; applyPriceDate(f); },
  'view-open': () => { ui.importMode = 'view'; $('#importFile').click(); },
  'view-old': () => download(`du-lieu-cu-trong-trinh-duyet-${today()}.json`, oldLocal, 'application/json'),
  'notice-close': () => setNotice(''),
  'export-json': () => download(`sao-luu-vang-${today()}.json`, JSON.stringify(D, null, 2), 'application/json'),
  'import-json': () => $('#importFile').click(),
  'file-open': async () => {
    let h;
    try {
      [h] = await showOpenFilePicker({ types: JSON_TYPES });
      // Mở nhầm bản sao lưu (file do app tải về) khi đã có file dữ liệu: hỏi khôi phục vào file dữ liệu thay vì chuyển sang ghi vào bản sao lưu
      const cur = fileHandle || pendingHandle;
      if (cur && /^(sao-luu-vang-|ban-trinh-duyet-)/.test(h.name) && !(await h.isSameEntry(cur))) {
        if (!confirm(`${h.name} là bản sao lưu. Khôi phục nội dung này vào ${cur.name}?\n\n` + (fileHandle ? 'Dữ liệu đang mở sẽ được thay toàn bộ (Hoàn tác được).' : `Nội dung hiện tại của ${cur.name} sẽ được tải về trước.`))) return;
        const F = await readData(h);
        if (fileHandle) { D = F; ui.plans = null; return commit('khôi phục từ ' + h.name); }
        return await restoreInto(pendingHandle, F, h.name);
      }
      await useFile(h, false);
    } catch (e) { fileError(e, h); }
  },
  'file-new': async () => {
    let h;
    const cur = fileHandle || pendingHandle;
    try {
      // Không gợi ý trùng tên file đang dùng: Chrome xóa trắng file được chọn trong hộp Lưu ngay lúc chọn
      h = await showSaveFilePicker({ suggestedName: !cur ? 'tai-san.json' : cur.name === 'tai-san-moi.json' ? 'tai-san-moi-2.json' : 'tai-san-moi.json', types: JSON_TYPES });
      if (cur && await h.isSameEntry(cur)) {
        if (fileHandle) {   // đang mở chính file đó: dữ liệu đang mở là của file, ghi lại vào đó
          await useFile(h, true, await fileSeen(h));
          return setNotice(`Đây là file đang dùng (<b>${esc(h.name)}</b>); dữ liệu đang mở đã được ghi lại vào đó.`);
        }
        // Ở màn chờ: nội dung file đã bị xóa trắng, chưa ghi gì vào; chỉ cách lấy lại
        Object.assign(ui, { gateError: `Bạn vừa chọn lại đúng file ${h.name} trong hộp Lưu. Chrome xóa trắng file được chọn ở hộp này nên file đang rỗng.`, gateBad: true, gateLost: false });
        return render();
      }
      // Chọn trúng một file khác đã có dữ liệu (trình duyệt không xóa trắng): coi như mở file đó, không ghi đè
      let existing = false;
      try { const fi = await h.getFile(); if (fi.size > 0) { const raw = JSON.parse(await fi.text()); existing = !!raw && typeof raw.vang === 'object'; } } catch { }
      await useFile(h, !existing);
    } catch (e) { fileError(e, h); }
  },
  // Màn chờ, file đang nhớ hỏng hoặc rỗng: ghi bản trong trình duyệt vào file đó
  'gate-local': async () => {
    const h = pendingHandle; if (!h) return;
    try {
      if (await h.requestPermission({ mode: 'readwrite' }) !== 'granted') return fileError(new Error('Chưa được cho phép ghi file ' + h.name + '.'), h);
      await writeInto(h, D, 'Bản trong trình duyệt');
    } catch (e) { fileError(e, h); }
  },
  // Màn chờ: chọn bản sao lưu rồi ghi vào đúng file đang nhớ
  'gate-restore': async () => {
    let b;
    try { [b] = await showOpenFilePicker({ types: JSON_TYPES }); await restoreInto(pendingHandle, await readData(b), b.name); } catch (e) { fileError(e, b); }
  },
  'gate-restore-go': async () => {
    const r = ui.gateRestore, h = pendingHandle; if (!r || !h) return;
    try {
      if (await h.requestPermission({ mode: 'readwrite' }) !== 'granted') return fileError(new Error('Chưa được cho phép ghi file ' + h.name + '.'), h);
      await writeInto(h, r.F, 'Bản sao lưu ' + esc(r.name));
    } catch (e) { fileError(e, h); }
  },
  'file-reconnect': async () => {
    const h = pendingHandle || await idbGet('file').catch(() => null); if (!h) return;
    try {
      if (await h.requestPermission({ mode: 'readwrite' }) !== 'granted') return fileError(new Error('Chưa được cho phép mở file ' + h.name + '.'), h);
      await useFile(h, false);
    } catch (e) { fileError(e, h); }
  }
};
// Chế độ xem: các thao tác làm thay đổi dữ liệu bị ẩn (CSS body.view) và chặn luôn ở đây
const EDIT_ACTS = new Set(['lot-add', 'lot-edit', 'lot-del', 'sell', 'hold', 'sale-edit', 'sale-del', 'rebuy', 'rebuy-clear', 'price-del', 'type-del',
  'plan-confirm', 'buy', 'undo', 'export-json', 'import-json', 'file-new', 'file-open', 'file-reconnect', 'gate-local', 'gate-restore', 'gate-restore-go']);
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled && !(VIEW && EDIT_ACTS.has(b.dataset.act))) act[b.dataset.act](b.dataset, b); });
document.addEventListener('input', e => {
  const el = e.target, f = el.form;
  if (!f || f.id !== 'priceForm') return;
  if (el.name === 'ngay') {   // ngày hợp lệ: các dòng giá điền theo ngày đó; đang gõ dở (trống, chưa hợp lệ) thì để yên
    if (validDate(el.value) && el.value !== ui.priceDate) { ui.priceDate = el.value; return applyPriceDate(f); }
  }
  if (el.name.startsWith('br_')) el.dataset.touched = '1';
  if (el.name.startsWith('mv_')) {
    const br = f['br_' + el.name.slice(3)], mv = parseM(el.value);
    if (br && !br.dataset.touched && br.dataset.spread !== '' && mv) br.value = fmtIn(mv + Number(br.dataset.spread));
  }
  refreshBuy(f);
});
const onReturn = () => { tickDay(); checkOnReturn(); };
document.addEventListener('visibilitychange', onReturn);
window.addEventListener('focus', onReturn);
setInterval(tickDay, 60000);   // tab hiện suốt qua nửa đêm, hay máy vừa thức dậy, cũng kịp sang ngày mới
// Phần thu gọn: mở ra mới vẽ (vẽ sẵn rồi thì thôi), đóng lại thì bỏ nội dung.
// Bấm vào tiêu đề thì vẽ ngay lúc bấm (sự kiện toggle đến sau, có thể kịp hiện một khung trống)
const fillLazy = d => { const body = d.querySelector('.lazy-body'); if (!body.childElementCount) body.innerHTML = LAZY[d.dataset.lazy].html(); };
document.addEventListener('click', e => { const d = e.target.closest?.('details[data-lazy] > summary')?.parentNode; if (d && !d.open) fillLazy(d); }, true);
document.addEventListener('toggle', e => {
  const d = e.target, k = d.dataset?.lazy; if (!k) return;
  ui[LAZY[k].flag] = d.open;
  if (d.open) fillLazy(d); else d.querySelector('.lazy-body').innerHTML = '';
}, true);
for (const ev of ['pointermove', 'pointerdown']) document.addEventListener(ev, e => { const svg = e.target.closest && e.target.closest('svg.chart'); if (svg) chartHover(svg, e); });
document.addEventListener('pointerdown', () => { pointerIsDown = true; }, true);
for (const ev of ['pointerup', 'pointercancel']) document.addEventListener(ev, () => { pointerIsDown = false; if (softPending && !softTimer) softTimer = setTimeout(flushSoft, 0); }, true);
document.addEventListener('keydown', e => {
  // Bảng giá: Enter = lưu dòng này (rời dòng) và xuống ô mua vào của dòng dưới
  if (e.key === 'Enter' && e.target.matches('#priceForm input')) {
    e.preventDefault();
    const row = e.target.closest('tr.prow'); if (!row) return;
    const next = row.nextElementSibling?.querySelector('input[name^=mv_]');
    next ? next.focus() : e.target.blur();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.target.matches('input, textarea, select') && !dlg.open) { e.preventDefault(); undo(); }
});
document.addEventListener('focusin', e => { if (e.target.matches('input.money, input[type=number]')) e.target.select(); });
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.matches('input.money')) el.value = fmtIn(parseM(el.value));
  // Rời khỏi một dòng giá là lưu dòng đó (chuyển giữa ô mua vào và ô bán ra cùng dòng thì chưa)
  const row = el.closest && el.closest('#priceForm tr.prow');
  if (!row || !el.matches('input.money')) return;
  const to = e.relatedTarget;
  if (to && row.contains(to) && to.matches('input.money')) return;
  saveRow(row.dataset.id);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'priceForm') e.preventDefault();   // giá lưu khi rời dòng, không có nút gửi
  else if (f.id === 'cashForm') {
    e.preventDefault();
    ui.cash = parseM(f.x.value); ui.plans = ui.cash > 0 ? cashPlans(ui.cash) : null; render();
  } else if (f.id === 'typeForm') {
    e.preventDefault();
    D.vang.loai.push({ id: 't' + Date.now().toString(36), ten: f.ten.value.trim(), don_vi_niem_yet: f.dv.value }); commit('thêm loại vàng');
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'loStatus') { ui.loStatus = el.value; render(); }
  else if (el.id === 'loType') { ui.loType = el.value; render(); }
  else if (el.id === 'lsYear') { ui.lsYear = el.value; render(); }
  else if (el.dataset.set) {
    const v = parseN(el.value);
    if (el.dataset.set === 'vang_mua_giam_pct' && !(v > 0)) { alert('% giảm từ đỉnh phải lớn hơn 0.'); return render(); }
    D.tham_so[el.dataset.set] = v; commit('sửa tham số');
  }
  else if (el.dataset.setMoney) { const v = parseM(el.value); D.tham_so[el.dataset.setMoney] = v > 0 ? v : null; commit('sửa hạn mức vốn'); }
  else if (el.dataset.typeName) { const t = typeById(el.dataset.typeName); if (t && el.value.trim()) { t.ten = el.value.trim(); commit('đổi tên loại vàng'); } }
  else if (el.dataset.typeUnit) { const t = typeById(el.dataset.typeUnit); if (t) { t.don_vi_niem_yet = el.value; commit('đổi đơn vị loại vàng'); } }
  else if (el.name && el.name.startsWith('kd_') && el.form?.id === 'priceForm') { if (el.checked) { const id = el.name.slice(3); saveRow(id); markSame([id]); } }
  else if (el.dataset.plan != null && el.dataset.row != null) {
    ui.plans[+el.dataset.plan].rows[+el.dataset.row].k = Math.max(0, Math.floor(parseN(el.value))); render();
  } else if (el.id === 'importFile') {
    const file = el.files[0]; el.value = ''; if (!file) return;
    const forView = ui.importMode === 'view'; ui.importMode = '';
    file.text().then(text => {
      let F; try { F = JSON.parse(text); } catch { return alert('File không phải JSON hợp lệ.'); }
      if (!F || !F.vang) return alert('File không đúng định dạng dữ liệu của app.');
      if (forView) { D = normalize(F); ui.viewLoaded = true; ui.viewTemp = false; ui.plans = null; _cache = null; tab = 'homnay'; return render(); }
      if (!confirm('Dữ liệu trong file sẽ THAY THẾ toàn bộ dữ liệu đang mở. Tiếp tục?')) return;
      D = normalize(F); ui.plans = null; commit('khôi phục từ bản sao lưu');
    });
  }
});

const fileErrMsg = (e, h) => e.name === 'NotFoundError' ? `Không tìm thấy file ${h ? h.name : ''} (có thể đã bị xóa hoặc chuyển chỗ). Dùng Mở file khác… hoặc Tạo file mới….` : e.message;
function fileError(e, h) {
  if (e.name === 'AbortError') return;   // bấm Hủy ở hộp chọn file
  if (!fileHandle && pendingHandle) {   // đang ở màn chờ: báo ngay trên màn chờ
    ui.gateError = fileErrMsg(e, h);
    // Cách lấy lại (khôi phục, dùng bản trình duyệt, tạo file mới) chỉ hiện khi chính file đang nhớ hỏng, rỗng hoặc mất
    if (h === pendingHandle) { ui.gateBad = !!e.bad; ui.gateLost = e.name === 'NotFoundError'; ui.gateRestore = null; }
    render();
  } else alert(fileErrMsg(e, h));
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// ===================== Khởi động =====================
(async () => {
  render();
  if (hasFSA) {
    // IndexedDB hay quyền file mà treo thì sau 2 giây vẫn vẽ app, không để trang trắng
    const timeout = p => Promise.race([p, new Promise(r => setTimeout(() => r(null), 2000))]);
    let h = null;
    try { h = await timeout(idbGet('file')); } catch { }
    if (h) {
      pendingHandle = h;
      try { if (await timeout(h.queryPermission({ mode: 'readwrite' })) === 'granted') { booting = false; await useFile(h, false); return; } }
      catch (e) { fileError(e, h); }   // file hỏng, rỗng, mất…: về màn chờ, báo lý do, không để trang trắng
    }
  }
  booting = false; render(); persistStatus();
})();
</script>
</body>
</html>
