<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý vàng</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e2e5e9;--text:#1d2329;--muted:#6b7580;--accent:#a8760a;--green:#17803f;--red:#c0392b;--yellow:#a86b00;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1400px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;margin-right:10px;color:var(--accent)}
.spacer{flex:1}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit;color:var(--muted)}
nav button.on{background:#fbf3e0;color:var(--accent);font-weight:600}
#status{font-size:12px;color:var(--muted)}
#status.err{color:var(--red)}
main{max-width:1400px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:14px 0 6px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc}
td.n,th.n{text-align:right}
tr.total td{font-weight:600;background:#fafbfc}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted)}.small{font-size:12px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--text)}
button:hover{border-color:#b9c0c8}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--red)}
button.sm{padding:2px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;border:1px solid #cdd3da;border-radius:6px;padding:5px 8px;background:#fff;color:var(--text)}
input.money{text-align:right;width:150px}
input.w{width:56px;text-align:right}
input[type=number]{width:90px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:3px}
.field>span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;background:#eef1f4}
.grp-chot h2{color:var(--green)}.grp-sap h2{color:var(--yellow)}.grp-lo h2{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.warn{background:#fff4e5;border:1px solid #f3d19c;border-radius:6px;padding:6px 10px;margin:8px 0}
.note{background:#eef4ff;border:1px solid #c9d8f5;border-radius:6px;padding:8px 10px;margin-bottom:12px}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;max-width:640px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(20,25,30,.35)}
dialog form{padding:16px}
dialog h2{margin:0 0 12px;font-size:17px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.preview{background:#fafbfc;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:8px}
.preview td{border:0;padding:2px 6px}
.old{color:var(--yellow)}
.hidden{display:none!important}
summary{cursor:pointer;color:var(--muted)}
details[open] summary{margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">🟡 Quản lý vàng</span>
    <nav id="tabs"></nav>
    <span class="spacer"></span>
    <span id="status"></span>
    <input type="file" id="importFile" accept=".json,application/json" class="hidden">
  </div>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script>
'use strict';
// ===================== Hằng số & tiện ích =====================
const KEY = 'tai-san-v1';
const UNITS = [['luong', 10000, 'lượng'], ['chi', 1000, 'chỉ'], ['phan', 100, 'phân'], ['ly', 10, 'ly'], ['dem', 1, 'dem']];
const UNIT_DEM = { luong: 10000, chi: 1000, phan: 100, ly: 10, dem: 1 };
const UNIT_NAME = { luong: 'lượng', chi: 'chỉ', phan: 'phân', ly: 'ly', dem: 'dem' };
const unitOptions = sel => Object.keys(UNIT_NAME).map(u => `<option value="${u}" ${sel === u ? 'selected' : ''}>${UNIT_NAME[u]}</option>`).join('');
const TABS = [['homnay', 'Hôm nay'], ['lo', 'Lô vàng'], ['cantien', 'Cần tiền'], ['lichsu', 'Lịch sử'], ['thamso', 'Tham số']];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const fmtD = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
const digits = x => (x == null || x === '' || isNaN(x)) ? '' : Math.round(x).toLocaleString('vi-VN');
const parseM = s => Number(String(s ?? '').replace(/\D/g, '')) || 0;
const parseN = s => { const v = Number(String(s ?? '').replace(',', '.')); return isNaN(v) ? 0 : v; };
const fmtM = x => (x == null || isNaN(x)) ? '—' : Math.round(x).toLocaleString('vi-VN') + ' đ';
const fmtMS = x => (x == null || isNaN(x)) ? '—' : (x > 0.5 ? '+' : '') + fmtM(x);
const fmtP = (x, sign = true) => (x == null || isNaN(x) || !isFinite(x)) ? '—' :
  (sign && x > 0 ? '+' : '') + (x * 100).toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
const cls = x => x > 0.5 ? 'pos' : x < -0.5 ? 'neg' : '';
const clsP = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
function fmtW(dem) {
  if (!dem) return '0';
  const parts = []; let r = dem;
  for (const [, v, name] of UNITS) { const q = Math.floor(r / v); r -= q * v; if (q) parts.push(q + ' ' + name); }
  return parts.join(' ');
}
function splitW(dem) { const o = {}; let r = dem; for (const [k, v] of UNITS) { o[k] = Math.floor(r / v); r -= o[k] * v; } return o; }

// ===================== Dữ liệu =====================
function emptyData() {
  return {
    phien_ban: 1, cap_nhat: '',
    tham_so: { lai_suat_ngan_hang: 5.5, lam_phat: 3.5, vang_ky_vong_mac_dinh: 15, vang_sap_dat_mac_dinh: 2 },
    vang: { loai: [], gia: [], lo: [], ban: [], so_thu_tu: { lo: {}, ban: 0 } },
    tiet_kiem: [], cctg: [], dat: []
  };
}
function normalize(d) {
  const e = emptyData();
  d = d && typeof d === 'object' ? d : {};
  d.phien_ban = d.phien_ban || 1;
  d.tham_so = Object.assign(e.tham_so, d.tham_so || {});
  d.vang = Object.assign(e.vang, d.vang || {});
  d.vang.so_thu_tu = Object.assign({ lo: {}, ban: 0 }, d.vang.so_thu_tu || {});
  for (const k of ['tiet_kiem', 'cctg', 'dat']) if (!Array.isArray(d[k])) d[k] = [];
  return d;
}
let D = (() => { try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch { return emptyData(); } })();

// ----- Lưu: trình duyệt + file -----
let fileHandle = null, pendingHandle = null, saveChain = Promise.resolve();
const hasFSA = 'showOpenFilePicker' in window;
function setStatus(msg, err) { const s = $('#status'); s.textContent = msg; s.className = err ? 'err' : ''; }
function persist() {
  D.cap_nhat = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { setStatus('Không lưu được vào trình duyệt: ' + e.message, true); }
  if (fileHandle) {
    const text = JSON.stringify(D, null, 2), h = fileHandle;
    saveChain = saveChain.then(async () => {
      try { const w = await h.createWritable(); await w.write(text); await w.close(); setStatus('Đã lưu vào ' + h.name); }
      catch (e) { setStatus('Lỗi ghi file: ' + e.message, true); }
    });
  } else persistStatus();
}
function persistStatus() { setStatus(hasFSA ? 'Chưa kết nối file — đang lưu tạm trong trình duyệt' : 'Đang lưu trong trình duyệt', !!hasFSA); }
function commit() { _cache = null; persist(); render(); }

// IndexedDB để nhớ file đã chọn giữa các lần mở app
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const rq = indexedDB.open('tai-san', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => { const tx = rq.result.transaction('kv', mode); const r = fn(tx.objectStore('kv')); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); };
  });
}
const idbGet = k => idb('readonly', s => s.get(k));
const idbSet = (k, v) => idb('readwrite', s => s.put(v, k));

async function useFile(handle, fromNew) {
  if (!fromNew) {
    const text = await (await handle.getFile()).text();
    let F = null;
    if (text.trim()) {
      try { F = normalize(JSON.parse(text)); } catch { alert('File này không phải dữ liệu JSON hợp lệ.'); return; }
    }
    if (F) {
      const localNewer = (D.cap_nhat || '') > (F.cap_nhat || '') && D.vang.lo.length > 0;
      const same = JSON.stringify(F) === JSON.stringify(D);
      if (!same && localNewer && confirm('Dữ liệu trong trình duyệt MỚI HƠN dữ liệu trong file "' + handle.name + '".\n\nOK = giữ dữ liệu trình duyệt và ghi đè vào file.\nHủy = dùng dữ liệu trong file.')) { /* giữ D */ }
      else D = F;
    }
  }
  fileHandle = handle; pendingHandle = null;
  try { await idbSet('file', handle); } catch { }
  commit();
}

// ===================== Tính toán vàng =====================
const r = () => D.tham_so.lai_suat_ngan_hang / 100;
const pi = () => D.tham_so.lam_phat / 100;
const typeById = id => D.vang.loai.find(t => t.id === id);
const lotById = id => D.vang.lo.find(l => l.id === id);
// Bộ nhớ đệm: giá mới nhất theo loại và số món đã bán theo lô (tính lại mỗi khi dữ liệu đổi)
let _cache = null;
function cache() {
  if (!_cache) {
    const lp = new Map(), sold = new Map();
    for (const p of D.vang.gia) { const b = lp.get(p.loai_id); if (!b || p.ngay >= b.ngay) lp.set(p.loai_id, p); }
    for (const b of D.vang.ban) sold.set(b.lo_id, (sold.get(b.lo_id) || 0) + b.so_mon);
    _cache = { lp, sold };
  }
  return _cache;
}
const latestPrice = typeId => cache().lp.get(typeId) || null;
const soldMon = lotId => cache().sold.get(lotId) || 0;
function lotW(lot) { const t = typeById(lot.loai_id); return lot.trong_luong_mon_dem / UNIT_DEM[t ? t.don_vi_niem_yet : 'chi']; }
function lotState(lot, asOf = today()) {
  const t = typeById(lot.loai_id);
  const w = lotW(lot);
  const n = lot.so_mon - soldMon(lot.id);
  const costMon = lot.tong_tien_mua / lot.so_mon;
  const V = n * costMon;
  const d = Math.max(0, days(lot.ngay_mua, asOf));
  const p = latestPrice(lot.loai_id);
  const s = { lot, t, w, n, costMon, V, d, p, hasPrice: !!p, kv: lot.ky_vong_pct / 100, sd: lot.sap_dat_pct / 100 };
  if (!p) return s;
  s.P = p.mua_vao; s.valMon = w * s.P;
  s.G = n * s.valMon; s.L = s.G - V; s.g = V > 0 ? s.G / V - 1 : 0;
  s.annual = d >= 30 ? Math.pow(1 + s.g, 365 / d) - 1 : null;
  s.B = V * (1 + r() * d / 365); s.vsBank = s.G - s.B;
  s.real = (1 + s.g) / Math.pow(1 + pi(), d / 365) - 1;
  s.targetPrice = n > 0 ? V * (1 + s.kv) / (n * w) : null;
  s.breakEven = s.G > 0 ? V / s.G - 1 : null;
  s.grp = s.g >= s.kv ? 'chot' : s.g < 0 ? 'lo' : s.g >= s.kv - s.sd ? 'sap' : 'giu';
  return s;
}
function saleCalc(sale) {
  const lot = lotById(sale.lo_id); if (!lot) return null;
  const w = lotW(lot), costMon = lot.tong_tien_mua / lot.so_mon, d = Math.max(0, days(lot.ngay_mua, sale.ngay));
  const thu = sale.so_mon * w * sale.gia_ban, von = sale.so_mon * costMon, loi = thu - von;
  const bank = von * (1 + r() * d / 365);
  return { lot, w, d, thu, von, loi, g: von > 0 ? loi / von : 0, bank, vsBank: thu - bank };
}
const openLots = () => D.vang.lo.filter(l => l.so_mon - soldMon(l.id) > 0);
const realizedTotal = () => D.vang.ban.reduce((a, b) => { const c = saleCalc(b); return a + (c ? c.loi : 0); }, 0);
const sellK = { het: s => s.n, nua: s => Math.ceil(s.n / 2), von: s => Math.min(s.n, Math.max(1, Math.ceil(s.V / s.valMon))) };

// ===================== Giao diện chung =====================
let tab = 'homnay';
const ui = { loStatus: 'open', loType: '', loOpen: null, lsYear: '', lsAllPrices: false, cash: 0, plans: null };
function render() {
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button class="${k === tab ? 'on' : ''}" data-act="tab" data-k="${k}">${n}</button>`).join('');
  const v = { homnay: viewHomNay, lo: viewLo, cantien: viewCanTien, lichsu: viewLichSu, thamso: viewThamSo }[tab];
  _cache = null;
  $('#app').innerHTML = fileBanner() + v();
}
function fileBanner() {
  if (!hasFSA || fileHandle) return '';
  if (pendingHandle) return `<div class="note">📂 Chưa mở file dữ liệu <b>${esc(pendingHandle.name)}</b>, thay đổi lúc này chỉ lưu tạm trong trình duyệt.
    <button class="primary" data-act="file-reconnect">Mở lại ${esc(pendingHandle.name)}</button></div>`;
  if (!D.vang.loai.length && !D.vang.lo.length) return '';
  return `<div class="note">Dữ liệu đang lưu tạm trong trình duyệt. Lưu vào file để không mất:
    <button class="primary" data-act="file-new">Tạo file dữ liệu…</button> <button data-act="file-open">Mở file có sẵn…</button></div>`;
}
const card = (title, body, extra = '') => `<section class="card ${extra}">${title ? `<h2>${title}</h2>` : ''}${body}</section>`;
const typeOptions = (sel, withAll) => (withAll ? `<option value="">Tất cả loại</option>` : '') +
  D.vang.loai.map(t => `<option value="${esc(t.id)}" ${t.id === sel ? 'selected' : ''}>${esc(t.ten)}</option>`).join('');

// ===================== Tab: Hôm nay =====================
function viewHomNay() {
  if (!D.vang.loai.length) return card('Bắt đầu', (hasFSA && !fileHandle && !pendingHandle ? `<p><b>Bước 1.</b> Tạo file lưu dữ liệu (nên đặt trong OneDrive/Google Drive):
      <button class="primary" data-act="file-new">Tạo file dữ liệu…</button> <button data-act="file-open">Mở file có sẵn…</button></p>
    <p><b>Bước 2.</b> ` : '<p>') + `Thêm lô vàng đầu tiên, loại vàng tạo ngay trong form: <button class="primary" data-act="lot-add">+ Thêm lô</button></p>`);
  const priceRows = D.vang.loai.map(t => {
    const p = latestPrice(t.id);
    const beMua = p && p.ban_ra ? p.ban_ra / p.mua_vao - 1 : null;
    return `<tr><td>${esc(t.ten)}</td><td>${UNIT_NAME[t.don_vi_niem_yet]}</td>
      <td><input class="money" name="mv_${esc(t.id)}" value="${p ? digits(p.mua_vao) : ''}" placeholder="0"></td>
      <td><input class="money" name="br_${esc(t.id)}" value="${p && p.ban_ra ? digits(p.ban_ra) : ''}" placeholder="0"></td>
      <td class="n">${beMua == null ? '—' : '+' + fmtP(beMua, false)}</td><td class="small ${p && p.ngay < today() ? 'old' : 'muted'}">${p ? 'giá ngày ' + fmtD(p.ngay) + (p.ngay < today() ? ' · chưa cập nhật hôm nay' : '') : 'chưa có giá'}</td></tr>`;
  }).join('');
  let html = card('Giá vàng', `<form id="priceForm"><div class="row"><label class="field"><span>Ngày</span><input type="date" name="ngay" value="${today()}" required></label></div>
    <div class="scroll"><table><tr><th>Loại</th><th>Đơn vị</th><th>Tiệm mua vào (giá bạn bán được)</th><th>Tiệm bán ra (giá bạn phải mua)</th><th class="n" title="Mua vào hôm nay thì giá phải tăng bấy nhiêu mới bán ra hòa vốn">Mua hôm nay cần tăng<br>để hòa vốn</th><th></th></tr>${priceRows}</table></div>
    <div class="row" style="margin-top:10px"><button class="primary" type="submit">Cập nhật giá</button><span class="spacer"></span><button type="button" data-act="lot-add">+ Thêm lô</button></div></form>`);

  const sts = openLots().map(l => lotState(l));
  const priced = sts.filter(s => s.hasPrice), noPrice = sts.filter(s => !s.hasPrice);
  const sumV = priced.reduce((a, s) => a + s.V, 0), sumG = priced.reduce((a, s) => a + s.G, 0), rz = realizedTotal();
  html += card('', `<div class="stats">
    <div class="stat"><span>Vốn đang giữ</span><b>${fmtM(sumV)}</b></div>
    <div class="stat"><span>Giá trị hôm nay</span><b>${fmtM(sumG)}</b></div>
    <div class="stat"><span>Lời tạm tính</span><b class="${cls(sumG - sumV)}">${fmtMS(sumG - sumV)}</b><span>${fmtP(sumV ? sumG / sumV - 1 : null)}</span></div>
    <div class="stat"><span>Lời đã chốt (từ trước đến nay)</span><b class="${cls(rz)}">${fmtMS(rz)}</b></div>
    <div class="stat"><span>Tổng lời</span><b class="${cls(sumG - sumV + rz)}">${fmtMS(sumG - sumV + rz)}</b></div></div>`);

  const groups = [
    ['chot', '🟢 Nên chốt — đã đạt mục tiêu', s => `<button class="sm primary" data-act="sell" data-id="${esc(s.lot.id)}">Bán…</button>
       <button class="sm" data-act="hold" data-id="${esc(s.lot.id)}">Giữ, nâng mục tiêu</button>`],
    ['sap', '🟡 Sắp đạt — theo dõi', s => `còn ${fmtP(s.kv - s.g, false)} · cần giá ${fmtM(s.targetPrice)}/${UNIT_NAME[s.t.don_vi_niem_yet]} <button class="sm" data-act="sell" data-id="${esc(s.lot.id)}">Bán…</button>`],
    ['giu', '⚪ Giữ — đang lời, chưa đạt', s => `còn ${fmtP(s.kv - s.g, false)} · cần giá ${fmtM(s.targetPrice)}/${UNIT_NAME[s.t.don_vi_niem_yet]}`],
    ['lo', '🔴 Đang lỗ — không nên bán, trừ khi cần tiền', s => `cần giá tăng ${fmtP(s.breakEven, false)} để hòa vốn <button class="sm" data-act="sell" data-id="${esc(s.lot.id)}">Bán…</button>`]
  ];
  for (const [g, title, extra] of groups) {
    const list = priced.filter(s => s.grp === g).sort((a, b) => b.g - a.g);
    if (!list.length) continue;
    const table = `<div class="scroll">${lotStateTable(list, extra)}</div>`;
    html += g === 'giu'
      ? `<section class="card grp-giu"><details><summary><b>${title} (${list.length})</b> <span class="muted small">— bấm để xem</span></summary>${table}</details></section>`
      : card(`${title} (${list.length})`, table, 'grp-' + g);
  }
  if (noPrice.length) html += card('Lô chưa có giá', `<p class="muted">Nhập giá cho loại vàng của các lô sau để xem gợi ý: ${noPrice.map(s => esc(s.lot.id)).join(', ')}</p>`);
  if (!sts.length) html += card('', `<p class="muted">Chưa có lô nào đang giữ.</p>`);

  const rebuy = D.vang.ban.filter(b => b.gia_mua_lai > 0).map(b => {
    const lot = lotById(b.lo_id); const p = lot && latestPrice(lot.loai_id);
    return { b, lot, p, hit: p && p.ban_ra && p.ban_ra <= b.gia_mua_lai };
  }).filter(x => x.lot);
  const hits = rebuy.filter(x => x.hit), waiting = rebuy.filter(x => !x.hit);

function cashPlans(X) {
  const sts = openLots().map(l => lotState(l)).filter(s => s.hasPrice && s.n > 0 && s.valMon > 0);
  const prof = sts.filter(s => s.g >= 0), loss = sts.filter(s => s.g < 0).sort((a, b) => b.g - a.g);
  const got = rows => rows.reduce((a, x) => a + x.k * x.s.valMon, 0);
  const fill = (order, rows = []) => {
    rows = rows.slice(); let have = got(rows);
    for (const s of order) {
      if (have >= X) break;
      const k = Math.min(s.n, Math.ceil((X - have) / s.valMon));
      rows.push({ s, k }); have += k * s.valMon;
    }
    return rows;
  };
  // Bỏ bớt món thừa: nếu bỏ một món mà vẫn đủ tiền thì không bán món đó (xét từ lô ít ưu tiên nhất)
  const prune = rows => {
    rows = rows.map(x => ({ ...x })); let have = got(rows);
    for (let i = rows.length - 1; i >= 0; i--) while (rows[i].k > 0 && have - rows[i].s.valMon >= X) { rows[i].k--; have -= rows[i].s.valMon; }
    return rows.filter(x => x.k > 0);
  };
  const A = prune(fill(loss, fill(prof.slice().sort((a, b) => (b.g >= b.kv) - (a.g >= a.kv) || b.g - a.g))));
  const single = prof.filter(s => s.n * s.valMon >= X).map(s => ({ s, k: Math.ceil(X / s.valMon) }))
    .sort((a, b) => (a.k * a.s.valMon - X) - (b.k * b.s.valMon - X));
  const B = single.length ? [single[0]] : prune(fill(loss, fill(prof.slice().sort((a, b) => b.n * b.valMon - a.n * a.valMon))));
  const C = prune(fill(loss, fill(prof.slice().sort((a, b) => a.g - b.g))));
  const toPlan = (name, desc, rows) => ({ name, desc, rows: rows.map(x => ({ id: x.s.lot.id, k: x.k })) });
  const plans = [
    toPlan('A. Chốt lời tốt nhất', 'Lô đạt mục tiêu trước, rồi lô lời % cao nhất', A),
    toPlan('B. Ít lô nhất', 'Ưu tiên một lô bán vừa đủ, hạn chế cắt lẻ nhiều lô', B),
    toPlan('C. Giữ lô tốt', 'Bán lô lời ít trước, giữ lô lời nhiều cho chạy tiếp', C)
  ];
  const key = p => JSON.stringify(p.rows);
  plans.forEach((p, i) => { const j = plans.findIndex(q => key(q) === key(p)); if (j < i) p.same = plans[j].name.slice(0, 1); });
  return plans;
}
function planSummary(plan, X) {
  let thu = 0, von = 0, lossLoi = 0, lossVsBank = 0, valid = true;
  const rows = plan.rows.map(r => {
    const lot = lotById(r.id); const s = lotState(lot);
    if (r.k > s.n || r.k < 0) valid = false;
    const t = r.k * s.valMon, v = r.k * s.costMon, bank = v * (1 + r_() * s.d / 365);
    thu += t; von += v;
    if (t - v < 0) { lossLoi += t - v; lossVsBank += t - bank; }
    return { r, s, t, v, loi: t - v };
  });
  const totalDem = openLots().reduce((a, l) => a + (l.so_mon - soldMon(l.id)) * l.trong_luong_mon_dem, 0) -
    rows.reduce((a, x) => a + x.r.k * x.s.lot.trong_luong_mon_dem, 0);
  const totalV = openLots().reduce((a, l) => a + lotState(l).V, 0) - von;
  return { rows, thu, von, loi: thu - von, du: thu - X, lossLoi, lossVsBank, totalDem, totalV, valid };
}

      ${D.vang.loai.map(t => `<tr><td><input data-type-name="${esc(t.id)}" value="${esc(t.ten)}"></td>

          ${unitOptions(t.don_vi_niem_yet)}</select></td>
        <td><button class="sm danger" data-act="type-del" data-id="${esc(t.id)}" ${D.vang.lo.some(l => l.loai_id === t.id) ? 'disabled title="Loại đã có lô, không xóa được"' : ''}>Xóa</button></td></tr>`).join('')}</table>
      <form id="typeForm"><div class="row" style="margin-top:10px"><label class="field"><span>Tên loại mới</span><input name="ten" required placeholder="VD: Nhẫn 9999"></label>
        <label class="field"><span>Đơn vị niêm yết</span><select name="dv">${unitOptions('chi')}</select></label>
        <button type="submit">+ Thêm loại</button></div></form>`) +
    card('Dữ liệu', (hasFSA
      ? `<p>${fileHandle ? `Đang lưu vào file <b>${esc(fileHandle.name)}</b>.` : 'Chưa kết nối file, dữ liệu đang lưu tạm trong trình duyệt.'}</p>
        <div class="row"><button data-act="file-new">Tạo file mới…</button><button data-act="file-open">Mở file khác…</button></div>`
      : `<p>Trình duyệt này không ghi trực tiếp vào file được, dữ liệu lưu trong trình duyệt. Nên dùng Chrome hoặc Edge.</p>`) +
      `<div class="row"><button data-act="export-json">Tải bản sao lưu</button><button data-act="import-json">Khôi phục từ bản sao lưu…</button></div>`);
}

// ===================== Hộp thoại =====================
const dlg = $('#dlg');
let dlgSubmit = null;
function openDlg(html, onSubmit, onInput) {
  dlg.innerHTML = `<form id="dlgForm" novalidate>${html}</form>`;
  dlgSubmit = onSubmit;
  const f = $('#dlgForm');
  if (onInput) { f.addEventListener('input', e => onInput(f, e)); onInput(f, {}); }
  dlg.showModal();
}
dlg.addEventListener('submit', e => {
  e.preventDefault();
  if (e.submitter && e.submitter.value === 'cancel') return dlg.close();
  if (dlgSubmit && dlgSubmit($('#dlgForm')) !== false) dlg.close();
});

function wInputs(prefix, dem) {
  const o = splitW(dem);
  return UNITS.map(([k, , n]) => `<label class="field"><span>${n}</span><input class="w" type="number" min="0" name="${prefix}_${k}" value="${o[k] || ''}"></label>`).join('');
}
const readW = (f, prefix) => UNITS.reduce((a, [k, v]) => a + Math.max(0, Math.floor(parseN(f[prefix + '_' + k].value))) * v, 0);

function dlgLot(lot, prefill) {
  const isEdit = !!lot;
  const T = D.tham_so;
  const fromSale = prefill && prefill.fromSale;
  lot = lot || Object.assign({ ngay_mua: today(), loai_id: D.vang.loai[0]?.id || '__new', so_mon: 1, trong_luong_mon_dem: 1000, tong_tien_mua: 0, ky_vong_pct: T.vang_ky_vong_mac_dinh, sap_dat_pct: T.vang_sap_dat_mac_dinh, ghi_chu: '' }, prefill || {});
  let last = 'tong', autoPrice = !isEdit;
  openDlg(`<h2>${isEdit ? 'Sửa lô ' + esc(lot.id) : fromSale ? 'Mua lại (từ lần bán ' + esc(fromSale) + ')' : 'Thêm lô vàng'}</h2>
    <div class="row"><label class="field"><span>Ngày mua</span><input type="date" name="ngay" value="${lot.ngay_mua}" required></label>
      <label class="field"><span>Loại vàng</span><select name="loai">${typeOptions(lot.loai_id)}<option value="__new" ${lot.loai_id === '__new' ? 'selected' : ''}>➕ Loại mới…</option></select></label></div>
    <div class="row" id="newType"><label class="field"><span>Tên loại mới</span><input name="ten_moi" placeholder="VD: SJC miếng"></label>
      <label class="field"><span>Đơn vị niêm yết giá</span><select name="dv_moi">${unitOptions('luong')}</select></label></div>
    <div class="row"><label class="field"><span>Số món</span><input type="number" min="1" name="so_mon" value="${lot.so_mon}" style="width:70px"></label>
      <span style="padding-bottom:6px">×</span> ${wInputs('w', lot.trong_luong_mon_dem)}</div>
    <p class="small muted" id="wInfo"></p>
    <div class="row"><label class="field"><span id="dgLabel">Đơn giá</span><input class="money" name="don_gia"></label>
      <label class="field"><span>Tổng tiền mua</span><input class="money" name="tong" value="${digits(lot.tong_tien_mua) || ''}"></label></div>
    <div class="row"><label class="field"><span>% kỳ vọng</span><input type="number" step="0.1" name="kv" value="${lot.ky_vong_pct}"></label>
      <label class="field"><span>% sắp đạt</span><input type="number" step="0.1" name="sd" value="${lot.sap_dat_pct}"></label></div>
    <label class="field"><span>Ghi chú</span><input name="ghi_chu" value="${esc(lot.ghi_chu)}" placeholder="Nơi mua, số seri…"></label>
    <div class="dlg-actions"><button value="cancel" type="submit" formnovalidate>Hủy</button><button class="primary" type="submit">Lưu</button></div>`,
    f => {
      const n = Math.floor(parseN(f.so_mon.value)), wd = readW(f, 'w'), tong = parseM(f.tong.value);
      let loai = f.loai.value;
      if (!f.ngay.value) return alert('Chưa nhập ngày mua.'), false;
      if (n < 1) return alert('Số món phải từ 1 trở lên.'), false;
      if (wd < 1) return alert('Chưa nhập trọng lượng mỗi món.'), false;
      if (tong <= 0) return alert('Chưa nhập giá mua.'), false;
      if (loai === '__new' && !f.ten_moi.value.trim()) return alert('Chưa nhập tên loại vàng mới.'), false;
      if (isEdit && n < soldMon(lot.id)) return alert('Lô đã bán ' + soldMon(lot.id) + ' món, số món không được nhỏ hơn.'), false;
      if (isEdit && D.vang.ban.some(b => b.lo_id === lot.id && b.ngay < f.ngay.value)) return alert('Ngày mua không được sau ngày của các lần bán.'), false;
      if (loai === '__new') {
        loai = 't' + Date.now().toString(36);
        D.vang.loai.push({ id: loai, ten: f.ten_moi.value.trim(), don_vi_niem_yet: f.dv_moi.value });
      }
      const data = { loai_id: loai, ngay_mua: f.ngay.value, so_mon: n, trong_luong_mon_dem: wd, tong_tien_mua: tong, ky_vong_pct: parseN(f.kv.value), sap_dat_pct: parseN(f.sd.value), ghi_chu: f.ghi_chu.value.trim() };
      if (isEdit) Object.assign(lotById(lot.id), data);
      else {
        const y = data.ngay_mua.slice(0, 4), seq = (D.vang.so_thu_tu.lo[y] || 0) + 1;
        D.vang.so_thu_tu.lo[y] = seq;
        D.vang.lo.push(Object.assign({ id: `V-${y}-${String(seq).padStart(3, '0')}` }, data));
      }
      if (fromSale) { const b = D.vang.ban.find(x => x.id === fromSale); if (b) b.gia_mua_lai = null; }
      commit();
    },
    (f, e) => {
      const isNew = f.loai.value === '__new';
      $('#newType').classList.toggle('hidden', !isNew);
      const unit = isNew ? f.dv_moi.value : typeById(f.loai.value)?.don_vi_niem_yet || 'chi';
      const n = Math.floor(parseN(f.so_mon.value)), wd = readW(f, 'w'), qty = n * wd / UNIT_DEM[unit];
      $('#dgLabel').textContent = 'Đơn giá (mỗi ' + UNIT_NAME[unit] + ')';
      $('#wInfo').textContent = n > 0 && wd > 0 ? `Tổng: ${fmtW(n * wd)} = ${qty.toLocaleString('vi-VN', { maximumFractionDigits: 4 })} ${UNIT_NAME[unit]}` : '';
      const tgt = e.target && e.target.name;
      if (tgt === 'don_gia') last = 'dg'; else if (tgt === 'tong') last = 'tong';
      // Lô mới: tự điền đơn giá = giá tiệm bán ra mới nhất của loại, cho tới khi bạn tự gõ giá
      if (tgt === 'don_gia' || tgt === 'tong') autoPrice = false;
      if (autoPrice && !isNew) { const p = latestPrice(f.loai.value); f.don_gia.value = p && p.ban_ra ? digits(p.ban_ra) : ''; last = 'dg'; }
      if (!qty) return;
      if (last === 'dg') f.tong.value = digits(parseM(f.don_gia.value) * qty);
      else if (tgt !== 'don_gia') f.don_gia.value = parseM(f.tong.value) ? digits(parseM(f.tong.value) / qty) : '';
    });
}

function dlgSale(lotId, sale) {
  const lot = lotById(lotId), s = lotState(lot), t = s.t;
  const maxN = s.n + (sale ? sale.so_mon : 0);   // khi sửa: số món của chính lần bán này được tính lại vào
  if (maxN <= 0) return;
  const unit = UNIT_NAME[t.don_vi_niem_yet];
  const priceNote = !sale && s.p ? `<span class="small ${s.p.ngay < today() ? 'old' : 'muted'}">Giá tiệm mua vào ngày ${fmtD(s.p.ngay)}${s.p.ngay < today() ? ', nên kiểm tra giá thực tế' : ''}</span>` : '';
  openDlg(`<h2>${sale ? 'Sửa lần bán ' + esc(sale.id) : 'Bán lô ' + esc(lot.id)} · ${esc(t.ten)}</h2>
    <p class="muted">${sale ? 'Lô ' + esc(lot.id) + ' · ' : ''}Có thể bán ${maxN} món × ${fmtW(lot.trong_luong_mon_dem)} · mua ngày ${fmtD(lot.ngay_mua)}</p>
    <div class="row"><label class="field"><span>Ngày bán</span><input type="date" name="ngay" value="${sale ? sale.ngay : today()}" required></label>
      <label class="field"><span>Số món bán (tối đa ${maxN})</span><input type="number" min="1" max="${maxN}" name="k" value="${sale ? sale.so_mon : 1}" style="width:80px"></label>
      <label class="field"><span>Giá bán (mỗi ${unit})</span><input class="money" name="gia" value="${sale ? digits(sale.gia_ban) : s.hasPrice ? digits(s.P) : ''}"></label></div>
    ${priceNote ? `<div class="row">${priceNote}</div>` : ''}
    <div class="row"><button type="button" class="sm" data-fill="het">Bán hết</button><button type="button" class="sm" data-fill="von">Bán lấy lại vốn</button><button type="button" class="sm" data-fill="nua">Bán một nửa</button></div>
    <div class="row"><label class="field"><span>Giá muốn mua lại (mỗi ${unit}, tùy chọn)</span><input class="money" name="mua_lai" value="${sale && sale.gia_mua_lai ? digits(sale.gia_mua_lai) : ''}"></label>
      <label class="field" style="flex:1"><span>Ghi chú</span><input name="ghi_chu" value="${sale ? esc(sale.ghi_chu) : ''}"></label></div>
    <div class="preview" id="salePreview"></div>
    <div class="dlg-actions"><button value="cancel" type="submit">Hủy</button><button class="primary" type="submit">${sale ? 'Lưu' : 'Xác nhận bán'}</button></div>`,
    f => {
      const k = Math.floor(parseN(f.k.value)), gia = parseM(f.gia.value);
      if (!f.ngay.value) return alert('Chưa nhập ngày bán.'), false;
      if (f.ngay.value < lot.ngay_mua) return alert('Ngày bán không được trước ngày mua.'), false;
      if (k < 1 || k > maxN) return alert('Số món bán phải từ 1 đến ' + maxN + '.'), false;
      if (gia <= 0) return alert('Chưa nhập giá bán.'), false;
      const data = { ngay: f.ngay.value, so_mon: k, gia_ban: gia, gia_mua_lai: parseM(f.mua_lai.value) || null, ghi_chu: f.ghi_chu.value.trim() };
      if (sale) Object.assign(sale, data);
      else {
        D.vang.so_thu_tu.ban += 1;
        D.vang.ban.push(Object.assign({ id: 'B-' + String(D.vang.so_thu_tu.ban).padStart(4, '0'), lo_id: lot.id }, data));
      }
      commit();
    },
    f => {
      const k = Math.floor(parseN(f.k.value)), gia = parseM(f.gia.value);
      const c = saleCalc({ lo_id: lot.id, ngay: f.ngay.value || today(), so_mon: k, gia_ban: gia });
      const left = maxN - k;
      $('#salePreview').innerHTML = k >= 1 && k <= maxN && gia > 0 ? `<table>
        <tr><td>Tiền thu về</td><td class="n"><b>${fmtM(c.thu)}</b></td></tr>
        <tr><td>Vốn của phần bán</td><td class="n">${fmtM(c.von)}</td></tr>
        <tr><td>Lời/lỗ chốt</td><td class="n ${cls(c.loi)}"><b>${fmtMS(c.loi)} (${fmtP(c.g)})</b></td></tr>
        <tr><td>Nếu số vốn này gửi ngân hàng (${c.d} ngày)</td><td class="n">${fmtM(c.bank)} → <span class="${cls(c.vsBank)}">${c.vsBank >= 0 ? 'vàng hơn' : 'vàng thua'} ${fmtM(Math.abs(c.vsBank))}</span></td></tr>
        <tr><td>Lô còn lại sau khi bán</td><td class="n">${left} món${left > 0 ? ' · ' + fmtW(left * lot.trong_luong_mon_dem) + ' · vốn ' + fmtM(left * s.costMon) : ' · lô sẽ đóng'}</td></tr></table>`
        : '<span class="muted">Nhập số món và giá bán để xem trước.</span>';
    });
  $('#dlgForm').addEventListener('click', e => {
    const b = e.target.closest('[data-fill]'); if (!b) return;
    const f = $('#dlgForm'), gia = parseM(f.gia.value);
    const st = { n: maxN, V: maxN * s.costMon, valMon: s.w * (gia || s.P || 0) };
    if (b.dataset.fill === 'von' && !st.valMon) return alert('Nhập giá bán trước.');
    f.k.value = sellK[b.dataset.fill](st);
    f.dispatchEvent(new Event('input'));
  });
}

function dlgHold(lotId) {
  const lot = lotById(lotId), s = lotState(lot), unit = UNIT_NAME[s.t.don_vi_niem_yet];
  const def = Math.ceil((s.g * 100 + 1) / 5) * 5;
  openDlg(`<h2>Giữ lô ${esc(lot.id)} · ${esc(s.t.ten)}</h2>
    <p>Lô đang lời <b class="pos">${fmtP(s.g)}</b>, đã vượt mục tiêu ${fmtP(s.kv, false)}. Đặt mục tiêu mới: lô chuyển sang nhóm Giữ và app nhắc lại khi lời đạt mức mới.</p>
    <div class="row"><label class="field"><span>Mục tiêu mới (%)</span><input type="number" step="0.1" name="kv" value="${def}"></label></div>
    <p class="small muted" id="holdInfo"></p>
    <div class="dlg-actions"><button value="cancel" type="submit">Hủy</button><button class="primary" type="submit">Lưu mục tiêu mới</button></div>`,
    f => {
      const kv = parseN(f.kv.value);
      if (kv <= s.g * 100) return alert('Mục tiêu mới phải cao hơn mức lời hiện tại (' + fmtP(s.g) + ').'), false;
      lot.ky_vong_pct = kv; commit();
    },
    f => { const kv = parseN(f.kv.value) / 100; $('#holdInfo').textContent = `Cần giá tiệm mua vào ${fmtM(s.V * (1 + kv) / (s.n * s.w))}/${unit} (hiện ${fmtM(s.P)}/${unit}).`; });
}

// ===================== Sự kiện =====================
const act = {
  tab: d => { tab = d.k; render(); window.scrollTo(0, 0); },
  'lot-add': () => dlgLot(null),
  'lot-edit': d => dlgLot(lotById(d.id)),
  'lot-del': d => { if (confirm('Xóa lô ' + d.id + '?')) { D.vang.lo = D.vang.lo.filter(l => l.id !== d.id); commit(); } },
  'lot-detail': d => { ui.loOpen = ui.loOpen === d.id ? null : d.id; render(); },
  sell: d => dlgSale(d.id),
  hold: d => dlgHold(d.id),
  'sale-edit': d => { const b = D.vang.ban.find(x => x.id === d.id); if (b) dlgSale(b.lo_id, b); },
  rebuy: d => {
    const b = D.vang.ban.find(x => x.id === d.id), lot = b && lotById(b.lo_id); if (!lot) return;
    dlgLot(null, { loai_id: lot.loai_id, trong_luong_mon_dem: lot.trong_luong_mon_dem, so_mon: b.so_mon, ky_vong_pct: lot.ky_vong_pct, sap_dat_pct: lot.sap_dat_pct, fromSale: b.id });
  },
  'prices-all': () => { ui.lsAllPrices = true; render(); },
  'sale-undo': d => { if (confirm('Hoàn tác lần bán ' + d.id + '? Số món sẽ được trả lại cho lô.')) { D.vang.ban = D.vang.ban.filter(b => b.id !== d.id); ui.plans = null; commit(); } },
  'rebuy-clear': d => { const b = D.vang.ban.find(x => x.id === d.id); if (b) { b.gia_mua_lai = null; commit(); } },
  'price-del': d => { if (confirm('Xóa dòng giá này?')) { D.vang.gia.splice(+d.i, 1); commit(); } },
  'type-del': d => { if (confirm('Xóa loại vàng này cùng lịch sử giá của nó?')) { D.vang.loai = D.vang.loai.filter(t => t.id !== d.id); D.vang.gia = D.vang.gia.filter(p => p.loai_id !== d.id); commit(); } },
  'plan-confirm': d => {
    const p = ui.plans[+d.plan], rows = p.rows.filter(x => x.k > 0);
    const S = planSummary({ rows }, ui.cash);
    if (!confirm(`Xác nhận bán theo ${p.name}?\n\n` + S.rows.map(x => `${x.s.lot.id}: ${x.r.k} món → ${fmtM(x.t)}`).join('\n') + `\n\nTổng thu: ${fmtM(S.thu)} · Lời/lỗ: ${fmtMS(S.loi)}`)) return;
    for (const x of S.rows) {
      D.vang.so_thu_tu.ban += 1;
      D.vang.ban.push({ id: 'B-' + String(D.vang.so_thu_tu.ban).padStart(4, '0'), lo_id: x.s.lot.id, ngay: today(), so_mon: x.r.k, gia_ban: x.s.P, gia_mua_lai: null, ghi_chu: 'Cần tiền ' + fmtM(ui.cash) });
    }
    ui.plans = null; ui.cash = 0; tab = 'lichsu'; commit();
  },
  'export-json': () => download(`sao-luu-vang-${today()}.json`, JSON.stringify(D, null, 2), 'application/json'),
  'import-json': () => $('#importFile').click(),
  'file-open': async () => { try { const [h] = await showOpenFilePicker({ types: [{ description: 'Dữ liệu tài sản', accept: { 'application/json': ['.json'] } }] }); await useFile(h, false); } catch (e) { if (e.name !== 'AbortError') alert(e.message); } },
  'file-new': async () => { try { const h = await showSaveFilePicker({ suggestedName: 'tai-san.json', types: [{ description: 'Dữ liệu tài sản', accept: { 'application/json': ['.json'] } }] }); await useFile(h, true); } catch (e) { if (e.name !== 'AbortError') alert(e.message); } },
  'file-reconnect': async () => {
    try { const h = pendingHandle || await idbGet('file'); if (h && await h.requestPermission({ mode: 'readwrite' }) === 'granted') await useFile(h, false); }
    catch (e) { alert('Không mở lại được file: ' + e.message); }
  }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) act[b.dataset.act](b.dataset, b); });
document.addEventListener('focusout', e => { if (e.target.matches('input.money')) { const v = parseM(e.target.value); e.target.value = v ? digits(v) : ''; } });
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'priceForm') {
    e.preventDefault();
    const ngay = f.ngay.value; if (!ngay) return alert('Chưa nhập ngày.');
    const all = [], changed = [];
    for (const t of D.vang.loai) {
      const mv = parseM(f['mv_' + t.id].value), br = parseM(f['br_' + t.id].value) || null;
      if (!mv) continue;
      if (br && br < mv) return alert(`${t.ten}: giá tiệm bán ra thấp hơn giá mua vào, kiểm tra lại.`);
      const lp = latestPrice(t.id), row = { ngay, loai_id: t.id, mua_vao: mv, ban_ra: br };
      all.push(row);
      if (!lp || lp.mua_vao !== mv || (lp.ban_ra || null) !== br) changed.push({ t, lp, row });
    }
    if (!all.length) return alert('Chưa nhập giá nào.');
    let save = changed.map(x => x.row);
    if (!changed.length) {
      if (!confirm(`Giá không đổi so với lần nhập trước. Ghi nhận giá này cho ngày ${fmtD(ngay)}?`)) return;
      save = all;
    }
    // Chặn gõ nhầm (thừa/thiếu số 0, nhầm giá lượng với giá chỉ)
    const big = changed.filter(x => x.lp && Math.abs(x.row.mua_vao / x.lp.mua_vao - 1) > 0.15);
    if (big.length && !confirm('Giá thay đổi nhiều so với lần trước:\n\n' + big.map(x => `${x.t.ten}: ${fmtM(x.lp.mua_vao)} → ${fmtM(x.row.mua_vao)} (${fmtP(x.row.mua_vao / x.lp.mua_vao - 1)})`).join('\n') + '\n\nGiá này có đúng không?')) return;
    for (const row of save) {
      D.vang.gia = D.vang.gia.filter(p => !(p.ngay === row.ngay && p.loai_id === row.loai_id));
      D.vang.gia.push(row);
    }
    commit();
  } else if (f.id === 'cashForm') {
    e.preventDefault();
    ui.cash = parseM(f.x.value); ui.plans = ui.cash > 0 ? cashPlans(ui.cash) : null; render();
  } else if (f.id === 'typeForm') {
    e.preventDefault();
    D.vang.loai.push({ id: 't' + Date.now().toString(36), ten: f.ten.value.trim(), don_vi_niem_yet: f.dv.value }); commit();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'loStatus') { ui.loStatus = el.value; render(); }
  else if (el.id === 'loType') { ui.loType = el.value; render(); }
  else if (el.id === 'lsYear') { ui.lsYear = el.value; render(); }
  else if (el.dataset.set) { D.tham_so[el.dataset.set] = parseN(el.value); commit(); }
  else if (el.dataset.typeName) { const t = typeById(el.dataset.typeName); if (t && el.value.trim()) { t.ten = el.value.trim(); commit(); } }
  else if (el.dataset.typeUnit) { const t = typeById(el.dataset.typeUnit); if (t) { t.don_vi_niem_yet = el.value; commit(); } }
  else if (el.dataset.plan != null && el.dataset.row != null) {
    ui.plans[+el.dataset.plan].rows[+el.dataset.row].k = Math.max(0, Math.floor(parseN(el.value))); render();
  } else if (el.id === 'importFile') {
    const file = el.files[0]; el.value = ''; if (!file) return;
    file.text().then(text => {
      let F; try { F = JSON.parse(text); } catch { return alert('File không phải JSON hợp lệ.'); }
      if (!F || !F.vang) return alert('File không đúng định dạng dữ liệu của app.');
      if (!confirm('Dữ liệu trong file sẽ THAY THẾ toàn bộ dữ liệu đang mở. Tiếp tục?')) return;
      D = normalize(F); ui.plans = null; commit();
    });
  }
});

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// ===================== Khởi động =====================
(async () => {
  render(); persistStatus();
  if (hasFSA) {
    try {
      const h = await idbGet('file');
      if (h) {
        if (await h.queryPermission({ mode: 'readwrite' }) === 'granted') await useFile(h, false);
        else { pendingHandle = h; render(); }
      }
    } catch { }
  }
})();
</script>
